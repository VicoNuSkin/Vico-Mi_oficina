  .vico-mark{width:110px; height:auto; fill:var(--brand); display:block;}

  main{flex:1; overflow-y:auto; padding:0 16px 90px;}
  .card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--line);}
  .paraque{background:var(--accent); border-radius:16px; padding:14px 16px; margin-bottom:14px; font-size:14px; color:var(--brand); line-height:1.4;}
  .row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--brand2); flex:none;}
  .row .t{font-size:14px; flex:1;}
  .row .sub{font-size:12px; color:var(--sub);}
  .section-title{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--sub); margin:4px 0 8px;}
  .stat3{display:flex; gap:10px; margin-bottom:14px;}
  .stat3 .box{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center;}
  .stat3 .box b{display:block; font-size:20px; color:var(--brand);}
  .stat3 .box small{font-size:11px; color:var(--sub);}
  .cta{display:block; width:100%; padding:14px; border:none; border-radius:14px; background:var(--brand); color:#fff; font-size:15px; font-weight:600; margin-top:4px;}
  input,select,textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);

  }
  .searchbar{position:sticky; top:0; background:var(--bg); padding:10px 0;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px;}
  .chip{flex:none; padding:6px 14px; border-radius:20px; background:var(--card); border:1px solid var(--line); font-size:13px; color:var(--sub);}
  .chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .persona{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .persona .av{width:38px; height:38px; border-radius:50%; background:var(--brand2); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex:none;}
  .persona .info{flex:1; min-width:0;}
  .persona .info .n{font-size:14px; font-weight:600;}
  .persona .info .m{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}

  nav.bottom .ic{font-size:18px;}
  .empty{text-align:center; color:var(--sub); font-size:13px; padding:24px 0;}
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:50;}
  .sheet{position:relative; background:var(--card); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:18px; max-height:85vh; overflow-y:auto; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));}
  .sheet h3{margin:0 0 12px; color:var(--brand);}
  .sheet .actions{display:flex; gap:10px; margin-top:6px;}
  .sheet .actions button{flex:1; padding:12px; border-radius:10px; border:none; font-size:14px;}
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-secondary{background:var(--accent); color:var(--brand);}
  .detail-hist{font-size:13px; padding:8px 0; border-bottom:1px solid var(--line);}
  .detail-hist .d{color:var(--sub); font-size:11px;}

    .list-grid .row{ border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:0; min-width:0; }

    .list-grid .row > div{ min-width:0; }

function repoInfo(p){
  if(!p.ultimaCompra||!p.ciclo) return null;
  const d=new Date(p.ultimaCompra+"T00:00:00"); d.setDate(d.getDate()+Number(p.ciclo));
  const hoy=new Date(todayStr()+"T00:00:00");
  return {fecha:d.toISOString().slice(0,10), dias:Math.round((d-hoy)/86400000)};
}

async function boot(){
  loadLocal();
  document.querySelectorAll('nav.bottom button').forEach(b=>{
    b.addEventListener('click', ()=>{ tab=b.dataset.tab; render(); });
  });
  document.getElementById('fab').addEventListener('click', ()=> openPersonaForm());
  render();
}

function render(){
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===(tab==='clientes'?'mas':tab)));
  document.getElementById('fab').style.display = tab==='personas' ? 'flex' : 'none';
  if(tab==='inicio') renderInicio();
  else if(tab==='personas') renderPersonas();
  else if(tab==='agenda') renderAgenda();
  else if(tab==='clientes') renderClientes();
  else if(tab==='metas') renderMetas();
  else if(tab==='equipo') renderEquipo();
  else if(tab==='biblioteca') renderBiblioteca();
  else if(tab==='estadisticas') renderEstadisticas();
  else if(tab==='campanas') renderCampanas();
  else if(tab==='campdet') renderCampanaDetail(window.curCamp);
  else if(tab==='qr') renderQR();
  else if(tab==='mensajes') renderMensajes();
  else if(tab==='mfoco') renderMFoco();
  else if(tab==='mrutinas') renderMRutinas();
  else if(tab==='macciones') renderMAcciones();
  else if(tab==='mtrabajo') renderMTrabajo();
  else if(tab==='mresumen') renderMResumen();
  else if(tab==='historial') renderHistorial();
  else renderMas();
}

function renderAgenda(){
  const {fecha:hoy, hora:horaAhora} = madridNow();
  const esPasado = e => e.fecha<hoy || (e.fecha===hoy && e.hora && e.hora<horaAhora);
  const prox = eventos.filter(e=>!esPasado(e)).sort((a,b)=> (a.fecha+(a.hora||'')).localeCompare(b.fecha+(b.hora||'')));
  const pasados = eventos.filter(esPasado).sort((a,b)=> (b.fecha+(b.hora||'')).localeCompare(a.fecha+(a.hora||'')));
  const verFin = window.verFinalizados;
  const evtRow = e => `<div class="row"><span class="dot"></span><div style="flex:1;"><div class="t">${fmtFecha(e.fecha)} · ${e.hora||''} — ${e.titulo}</div><div class="sub">${e.tipo||''}${e.recurrenciaId?' · se repite':''}</div></div>${e.link?`<a href="${e.link}" target="_blank" style="color:var(--brand);font-size:12px;font-weight:600;text-decoration:none;margin-right:6px;">UNIRME</a>`:''}<span data-editevt="${e.id}" style="color:var(--brand);font-size:12px;font-weight:600;padding:4px 6px;">EDITAR</span><span data-delevt="${e.id}" style="color:var(--sub);padding:0 4px;">✕</span></div>`;
  $main.innerHTML = `
    <div class="section-title">Próximos eventos</div>
    <div class="card">
      ${prox.length ? prox.map(evtRow).join('') : '<div class="empty">Sin eventos próximos</div>'}
    </div>
    <button class="cta" id="addEvt">+ Agendar evento</button>
    <div class="section-title" style="margin-top:14px;cursor:pointer;" id="toggleFin">Eventos finalizados (${pasados.length}) ${verFin?'▲':'▼'}</div>
    ${verFin?`<div class="card">${pasados.length?pasados.map(evtRow).join(''):'<div class="empty">Sin eventos finalizados</div>'}</div>`:''}
  `;
  document.getElementById('addEvt').addEventListener('click', ()=>openEventoForm(null));
  document.getElementById('toggleFin').addEventListener('click', ()=>{ window.verFinalizados=!verFin; renderAgenda(); });
  $main.querySelectorAll('[data-editevt]').forEach(el=>el.addEventListener('click',()=>openEventoForm(el.dataset.editevt)));
  $main.querySelectorAll('[data-delevt]').forEach(el=>el.addEventListener('click',()=>{
    const ev=eventos.find(x=>x.id===el.dataset.delevt); if(!ev) return;
    if(ev.recurrenciaId){
      if(!confirm('Este evento se repite. Aceptar para borrar ESTE Y LOS SIGUIENTES de la serie, o Cancelar para borrar solo este.')){
        eventos=eventos.filter(x=>x.id!==ev.id);
      } else {
        eventos=eventos.filter(x=>!(x.recurrenciaId===ev.recurrenciaId && x.fecha>=ev.fecha));
      }
    } else {
      if(!confirm('¿Eliminar este evento?')) return;
      eventos=eventos.filter(x=>x.id!==ev.id);
    }
    saveEventos(); renderAgenda();
  }));
}

  const c=personas.filter(p=>!a.includes(p)&&!b.includes(p)&&p.tipo!=='Socia');
  return a.concat(b).concat(c).slice(0,3);
}

function renderMTrabajo(){

  const fmt=ms=>{ const s=Math.max(0,Math.floor(ms/1000)); const h=String(Math.floor(s/3600)).padStart(2,'0'); const m=String(Math.floor((s%3600)/60)).padStart(2,'0'); const ss=String(s%60).padStart(2,'0'); return h+':'+m+':'+ss; };
  const sug=sugeridasParaBloque();
  $main.innerHTML=`<div class="chips"><div class="chip" id="mt_salir">Minimizar</div></div>
    <h3 style="margin-top:4px;">🔥 Mi foco de hoy</h3>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center;">
      <div><div class="sub">Tiempo: ${b.tiempoPlanMin} min · ${b.pausado?'⏸ Pausado':'⏱'} <b id="mt_crono">${fmt(elapsedMs())}</b></div><div class="sub">Focos: ${b.focos.join(' + ')}</div></div>
      <button id="mt_pausa" style="border:none;background:var(--accent);color:var(--brand);border-radius:10px;padding:8px 12px;font-weight:600;">${b.pausado?'Reanudar':'Pausar'}</button>
    </div>
    ${b.focos.map(f=>`<div class="section-title">${FOCOS_CFG[f].icon} ${f.toUpperCase()}</div>
    <div class="card">
      ${b.acciones.filter(a=>a.foco===f).map(a=>`<div class="row">
        <div class="t" style="flex:1;">${a.nombre}<div class="sub">${a.hecho}/${a.objetivo}${a.min?' min':''}</div></div>
        <span data-mminus="${a.id}" style="padding:2px 8px;color:var(--brand);font-weight:700;">−</span>
        <span data-mplus="${a.id}" style="padding:4px 10px;background:var(--brand);color:#fff;border-radius:8px;font-weight:700;">+1</span>
        <span data-asoc="${a.id}" style="padding:4px 6px;color:var(--brand2);">👤</span>
      </div>`).join('')}
    </div>`).join('')}
    ${sug.length?`<div class="section-title">⚡ Personas que podrías contactar</div>
    <div class="card">${sug.map(p=>`<div class="row" data-verp="${p.id}"><span class="dot"></span><div><div class="t">${p.nombre}</div><div class="sub">${p.proximaAccion||repoTxt(p)}</div></div></div>`).join('')}</div>`:''}
    <button class="cta" id="mt_terminar" style="background:var(--accent);color:var(--brand);">Terminar mi oficina</button>`;
  document.getElementById('mt_salir').addEventListener('click',()=>{tab='inicio';render();});
  document.getElementById('mt_pausa').addEventListener('click',()=>{
    if(b.pausado){ b.pausaTotalMs=(b.pausaTotalMs||0)+(Date.now()-new Date(b.pausaInicio).getTime()); b.pausado=false; b.pausaInicio=null; }
    else { b.pausado=true; b.pausaInicio=new Date().toISOString(); }
    guardarBloqueActivo(b); renderMTrabajo();
  });
  document.querySelectorAll('[data-mplus]').forEach(el=>el.addEventListener('click',()=>{ const a=b.acciones.find(x=>x.id===el.dataset.mplus); a.hecho++; guardarBloqueActivo(b); renderMTrabajo(); }));
  document.querySelectorAll('[data-mminus]').forEach(el=>el.addEventListener('click',()=>{ const a=b.acciones.find(x=>x.id===el.dataset.mminus); a.hecho=Math.max(0,a.hecho-1); guardarBloqueActivo(b); renderMTrabajo(); }));
  document.querySelectorAll('[data-asoc]').forEach(el=>el.addEventListener('click',()=>openAsociarPersona(el.dataset.asoc)));
  document.querySelectorAll('[data-verp]').forEach(el=>el.addEventListener('click',()=>openPersonaDetail(el.dataset.verp)));
  document.getElementById('mt_terminar').addEventListener('click',()=>{
    if(!confirm('¿Terminar y guardar el bloque de hoy?')) return;
    tab='mresumen'; render();
  });
  window.timerInt=setInterval(()=>{
    if(tab!=='mtrabajo'){ clearInterval(window.timerInt); return; }
    const el=document.getElementById('mt_crono'); if(!el){ clearInterval(window.timerInt); return; }
    if(!b.pausado) el.textContent=fmt(elapsedMs());
  },1000);
}

function openAgregarPersonasCampana(campId){
  const c=campanas.find(x=>x.id===campId);
  const yaIds=new Set((c.personas||[]).map(x=>x.personaId));
  const sel=new Set();
  const draw=(filtro,q)=>{
    let list=personas.filter(p=>!yaIds.has(p.id));
    if(filtro&&filtro!=='Todos') list=list.filter(p=>p.tipo===filtro);
    if(q) list=list.filter(p=>p.nombre.toLowerCase().includes(q.toLowerCase()));
    openModal(`<button class="close-x" onclick="closeModal()">✕</button><h3 style="padding-right:34px;">Agregar personas</h3>
      <input id="ap_q" placeholder="Buscar por nombre..." value="${q||''}">
      <div class="chips">${['Todos','Potencial','Cliente','Socia'].map(f=>`<div class="chip ${(filtro||'Todos')===f?'active':''}" data-apf="${f}">${f}</div>`).join('')}</div>
      <div style="max-height:40vh;overflow-y:auto;">${list.length?list.map(p=>`<div class="persona" data-ap="${p.id}"><div class="av" style="${sel.has(p.id)?'':'opacity:.4'}">${sel.has(p.id)?'✓':initials(p.nombre)}</div><div class="info"><div class="n">${p.nombre}</div><div class="m">${p.tipo||''}</div></div></div>`).join(''):'<div class="empty">Nada por aquí</div>'}</div>
      <div class="sub" style="margin:8px 0;">${sel.size} persona${sel.size===1?'':'s'} seleccionada${sel.size===1?'':'s'}</div>
      <button class="cta" id="doAddP">Agregar a la campaña</button>`);
    document.getElementById('ap_q').addEventListener('input',e=>draw(filtro,e.target.value));
    document.querySelectorAll('[data-apf]').forEach(el=>el.addEventListener('click',()=>draw(el.dataset.apf,q)));
    document.querySelectorAll('[data-ap]').forEach(el=>el.addEventListener('click',()=>{ const i=el.dataset.ap; if(sel.has(i)) sel.delete(i); else sel.add(i); draw(filtro,q); }));
    document.getElementById('doAddP').addEventListener('click',()=>{
      if(!sel.size) return;
      sel.forEach(pid=>c.personas.push({personaId:pid, motivo:'Otro', estado:'Pendiente', nota:'', proximaFecha:''}));
      saveCampanas(); closeModal(); render();
    });
  };
  draw('Todos','');
}

function registrarAccionCampana(campId, personaId, onDone){
  const c=campanas.find(x=>x.id===campId); const entry=c.personas.find(x=>x.personaId===personaId); const p=personas.find(x=>x.id===personaId);
  openModal(`<button class="close-x" onclick="closeModal()">✕</button><h3 style="padding-right:34px;">¿Qué pasó?</h3>
    <select id="qp_res">${QUE_PASO.map(o=>`<option>${o}</option>`).join('')}</select>
    <textarea id="qp_nota" rows="2" placeholder="Nota (opcional)"></textarea>
    <label class="sub" style="display:flex;align-items:center;gap:8px;margin:8px 0;"><input type="checkbox" id="qp_seg"> ¿Necesita seguimiento?</label>
    <div id="qp_segbox" style="display:none;">
      <div style="display:flex;gap:8px;"><input id="qp_fecha" type="date"><input id="qp_hora" type="time"></div>
      <input id="qp_motseg" placeholder="Motivo del seguimiento">
    </div>
    <div class="actions"><button class="btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn-primary" id="qp_save">Registrar</button></div>`);
  document.getElementById('qp_seg').addEventListener('change',e=>{ document.getElementById('qp_segbox').style.display=e.target.checked?'block':'none'; });
  document.getElementById('qp_save').addEventListener('click',()=>{
    const resultado=document.getElementById('qp_res').value, nota=document.getElementById('qp_nota').value.trim();
    entry.estado=QP_ESTADO[resultado]||entry.estado; entry.nota=nota;
    const texto='Campaña "'+c.nombre+'" — '+resultado+(nota?': '+nota:'');
    p.historial=(p.historial||[]).concat({fecha:todayStr(),texto});
    p.ultimaNota=texto;
    if(document.getElementById('qp_seg').checked){
      const fecha=document.getElementById('qp_fecha').value, hora=document.getElementById('qp_hora').value, mot=document.getElementById('qp_motseg').value.trim();
      if(fecha){ eventos.push({id:uid(),titulo:'Seguimiento con '+p.nombre+' ('+c.nombre+')',tipo:'Seguimiento',fecha,hora,personaId:p.id}); saveEventos(); p.proximaFecha=fecha; p.proximaAccion=mot||('Seguimiento — '+c.nombre); entry.proximaFecha=fecha; }
    }
    savePersonas(); saveCampanas(); closeModal();
    if(onDone) onDone(); else render();
  });
}

function openMoverCampana(campId){
  const c=campanas.find(x=>x.id===campId);
  const cola=()=>(c.personas||[]).filter(x=>x.estado==='Pendiente'||x.estado==='Seguimiento');
  const step=()=>{
    const q=cola();
    if(!q.length){ closeModal(); alert('No quedan personas pendientes en esta campaña por ahora 🎉'); render(); return; }
    const entry=q[0]; const p=personas.find(x=>x.id===entry.personaId);
    openModal(`<button class="close-x" onclick="closeModal()">✕</button><h3 style="padding-right:34px;">${p.nombre}</h3>
      <div class="sub">${p.producto||p.tipo||''}</div>
      <div class="section-title">Motivo</div><div style="font-size:14px;margin-bottom:8px;">${entry.motivo}</div>
      ${p.ultimaNota?`<div class="section-title">Última interacción</div><div style="font-size:13px;color:var(--sub);margin-bottom:8px;">${p.ultimaNota}</div>`:''}
      <div class="actions">
        ${p.telefono?`<a class="cta" style="text-align:center;text-decoration:none;flex:1;" target="_blank" href="${waLink(p.telefono, campMsgFor(c,entry.motivo) || ('Hola '+p.nombre.split(' ')[0]+'! Te escribo por '+c.nombre+'.'))}">WhatsApp</a>`:''}
        ${p.telefono?`<a class="cta" style="text-align:center;text-decoration:none;flex:1;background:var(--accent);color:var(--brand);" href="tel:${p.telefono}">Llamar</a>`:''}
      </div>
      <button class="cta" id="mc_reg">Registrar resultado</button>
      <button class="cta" id="mc_skip" style="background:none;color:var(--sub);">Omitir por ahora</button>`);
    document.getElementById('mc_reg').addEventListener('click',()=>{ registrarAccionCampana(campId, entry.personaId, step); });
    document.getElementById('mc_skip').addEventListener('click',()=>{ const rest=q.slice(1).concat(q[0]); c.personas=c.personas.filter(x=>!q.includes(x)).concat(rest); saveCampanas(); step(); });
  };
  step();
}

    ${activas.length?`<select id="nm_camp"><option value="">Sin campaña vinculada</option>${activas.map(c=>`<option value="${c.id}">${c.nombre}</option>`).join('')}</select>`:''}

    <div class="actions"><button class="btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn-primary" id="nm_send">Enviar</button></div>
    <div id="nm_msg" class="sub" style="margin-top:6px;"></div>`);
  document.getElementById('nm_todos').addEventListener('change',e=>{ todos=e.target.checked; document.getElementById('nm_dest').style.display=todos?'none':'block'; });
  document.getElementById('nm_send').addEventListener('click',async()=>{
    const texto=document.getElementById('nm_txt').value.trim();
    const sel=Array.from(document.querySelectorAll('.nm_u:checked')).map(x=>x.value);
    if(!todos && !sel.length){ alert('Elegí al menos una persona o "Enviar a todos".'); return; }
    if(!texto){ alert('Escribí un mensaje.'); return; }
    const btn=document.getElementById('nm_send'); btn.disabled=true;
    document.getElementById('nm_msg').textContent='Enviando...';
    try{
      const campSel=document.getElementById('nm_camp');
      const campId=campSel?campSel.value:'';
      const camp=campId?campanas.find(c=>c.id===campId):null;
      await window.enviarMensaje({destinatarios: todos?'todos':sel, texto, campanaId:campId, campanaNombre:camp?camp.nombre:''});
      closeModal(); tab='mensajes'; render();
    }catch(err){ document.getElementById('nm_msg').textContent='No se pudo enviar. Probá de nuevo.'; btn.disabled=false; }
  });
}

function renderHistorial(){
  const list=bloques.slice().filter(b=>b.horaInicio).sort((a,b)=>(b.horaInicio||'').localeCompare(a.horaInicio||''));
  $main.innerHTML=`<div class="chips"><div class="chip" id="backHist">← Más</div></div>
    <div class="card list-grid" style="padding:10px;">
      ${list.length?list.map(b=>{
        const hechos=(b.acciones||[]).filter(a=>a.hecho>0).length;
        const min=b.tiempoRealMin||0; const htxt=min>=60?`${Math.floor(min/60)} h ${min%60} min`:`${min} min`;
        return `<div class="row" data-vb="${b.id}"><span class="dot"></span><div><div class="t">${fmtFecha(b.fecha)} · ${htxt}</div><div class="sub">${(b.focos||[]).join(' + ')} · ${hechos} acciones</div></div></div>`;
      }).join(''):'<div class="empty">Todavía no guardaste ningún día</div>'}
    </div>`;
  document.getElementById('backHist').addEventListener('click',()=>{tab='mas';render();});
  $main.querySelectorAll('[data-vb]').forEach(el=>el.addEventListener('click',()=>openDetalleBloque(el.dataset.vb)));
}

function openDetalleBloque(id){
  const b=bloques.find(x=>x.id===id); if(!b) return;
  const hechos=(b.acciones||[]).filter(a=>a.hecho>0);
  const resCount={}; (b.resultados||[]).forEach(r=>{ resCount[r]=(resCount[r]||0)+1; });
  const min=b.tiempoRealMin||0; const htxt=min>=60?`${Math.floor(min/60)} h ${min%60} min`:`${min} min`;
  openModal(`<button class="close-x" onclick="closeModal()">✕</button><h3 style="padding-right:34px;">${fmtFecha(b.fecha)}</h3>
    <div class="sub" style="margin-bottom:10px;">${htxt} · ${(b.focos||[]).join(' + ')}</div>
    <div class="section-title">Acciones</div>
    <div class="card">${hechos.length?hechos.map(a=>`<div class="row"><span class="dot"></span><div class="t">${a.hecho}/${a.objetivo}${a.min?' min':''} — ${a.nombre}</div></div>`).join(''):'<div class="empty">Sin acciones registradas</div>'}</div>
    ${Object.keys(resCount).length?`<div class="section-title">Resultados</div><div class="card">${Object.entries(resCount).map(([k,v])=>`<div class="row"><span class="dot"></span><div class="t">${v} — ${k}</div></div>`).join('')}</div>`:''}
  `);
}

function openEventoForm(editId){
  const ev = editId ? eventos.find(x=>x.id===editId) : null;
  const opciones = personas.map(p=>`<option value="${p.id}" ${ev&&ev.personaId===p.id?'selected':''}>${p.nombre}</option>`).join('');
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3 style="padding-right:34px;">${ev?'Editar evento':'Agendar evento'}</h3>
    <input id="e_titulo" placeholder="Título (ej: Llamada con...)" value="${ev?(ev.titulo||'').replace(/"/g,'&quot;'):''}">
    <select id="e_tipo">
      ${['Llamada','Reunión','Seguimiento','Capacitación','Evento','1:1','Tarea'].map(t=>`<option ${ev&&ev.tipo===t?'selected':''}>${t}</option>`).join('')}
    </select>
    <input id="e_fecha" type="date" value="${ev?ev.fecha:todayStr()}">
    <input id="e_hora" type="time" value="${ev?(ev.hora||''):''}">
    <select id="e_persona"><option value="">— Sin vincular —</option>${opciones}</select>
    <input id="e_link" placeholder="Link de Zoom / Meet (opcional)" value="${ev?(ev.link||'').replace(/"/g,'&quot;'):''}">
    <label class="sub" style="display:flex;align-items:center;gap:8px;margin:8px 0 2px;"><input type="checkbox" id="e_rep" style="width:auto;flex:none;" ${ev&&ev.recurrenciaId?'checked':''}> Se repite cada semana (mismo día y hora)</label>
    <div id="e_repbox" style="display:${ev&&ev.recurrenciaId?'block':'none'};">
      <input id="e_hasta" type="date" placeholder="Repetir hasta (opcional)">
      <div class="sub" style="margin:-6px 0 8px;">Si no ponés fecha, se agenda por 3 meses.</div>
    </div>
    <div class="actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" id="saveE">Guardar</button>
    </div>
  `);
  const erep=document.getElementById('e_rep'); if(erep) erep.addEventListener('change',e=>{ document.getElementById('e_repbox').style.display=e.target.checked?'block':'none'; });
  document.getElementById('saveE').addEventListener('click', ()=>{
    const titulo = document.getElementById('e_titulo').value.trim();
    if(!titulo) return;
    const tipo=document.getElementById('e_tipo').value, hora=document.getElementById('e_hora').value, personaId=document.getElementById('e_persona').value, link=document.getElementById('e_link').value.trim();
    const fechaInicial=document.getElementById('e_fecha').value;
    const repite=document.getElementById('e_rep').checked;
    if(ev){
      ev.titulo=titulo; ev.tipo=tipo; ev.hora=hora; ev.personaId=personaId; ev.link=link; ev.fecha=fechaInicial;
      if(repite && !ev.recurrenciaId){
        const recId=uid(); ev.recurrenciaId=recId;
        let hasta=document.getElementById('e_hasta').value;
        if(!hasta){ const d=new Date(fechaInicial+'T00:00:00'); d.setMonth(d.getMonth()+3); hasta=d.toISOString().slice(0,10); }
        let fecha=fechaInicial;
        while(true){
          const d=new Date(fecha+'T00:00:00'); d.setDate(d.getDate()+7); fecha=d.toISOString().slice(0,10);
          if(fecha>hasta) break;
          eventos.push({id:uid(), titulo, tipo, fecha, hora, personaId, link, recurrenciaId:recId});
        }
      }
      saveEventos(); closeModal(); render(); return;
    }
    const recId = repite ? uid() : null;
    let hasta = repite ? document.getElementById('e_hasta').value : '';
    if(repite && !hasta){ const d=new Date(fechaInicial+'T00:00:00'); d.setMonth(d.getMonth()+3); hasta=d.toISOString().slice(0,10); }
    let fecha = fechaInicial;
    while(true){
      eventos.push({id:uid(), titulo, tipo, fecha, hora, personaId, link, recurrenciaId:recId});
      if(!repite) break;
      const d=new Date(fecha+'T00:00:00'); d.setDate(d.getDate()+7); fecha=d.toISOString().slice(0,10);
      if(fecha>hasta) break;
    }
    saveEventos();
    closeModal();
    render();
  });
}

  lr.innerHTML=`<div style="width:100%;max-width:340px;text-align:center;"><svg class="vico-mark-lg" viewBox="0 0 1080 569.95" xmlns="http://www.w3.org/2000/svg"><path d="M181.09,250.79c.24,40.41,9.58,82.79,31.62,117.21,19.04,29.74,55.91,36.68,74.05,2.07,15.54-29.64,16.32-62.52,26.63-93.71,15.11-45.72,48.17-69.51,96.5-65.8,22.76,1.74,22.65-33.73,0-35.46-67.23-5.15-114.66,35.15-132.71,98.42-3.99,13.99-5.92,28.42-9.01,42.61-1.75,8.02-6.42,36.21-13.41,38.85-15.73,5.94-27.46-38.08-30.07-46.74-5.67-18.8-8.03-37.84-8.15-57.44-.13-22.81-35.6-22.86-35.46,0h0Z"/><path d="M866.61,374.25c-28.42,20.88-74.34,28.06-106.84,13.17-17.07-7.8-29.61-22.56-36.66-39.72-15.96,17.25-35.6,30.85-58.16,39.06-34.53,12.5-83.03,11.62-111.67-14.45-12.28-11.17-20.7-26.55-24.83-43.13-16,23.67-34.44,47.79-60.16,59.54-30.99,14.19-61.09-.93-72.84-31.56-12.41-32.32-7.54-68.71-3.28-102.14,2.84-22.39,38.3-22.56,35.46,0-3.46,27.09-13.21,70.8,3.5,95.58,21.99,32.5,66.72-39.5,76.96-54.7,9.75-14.5,22.65-32.36,37.73-46.95,7.85-7.62,16.31-14.36,25.22-19.28.09-.04.13-.09.22-.09,18.97-10.46,40.03-12.59,61.89,2.53,18.53,12.86,1.86,42.65-17.87,30.63-30.68-18.62-56.12,19.2-54.13,46.73,1.82,25.76,16.58,41.94,41.05,47.57,53.29,12.28,99.57-27,120.36-72.57,9.53-20.88,39.59-2.7,30.63,17.91-10.2,23.45,10.86,52.98,34.14,56.26,18.97,2.66,41.85-.93,57.72-12.32,20.48-14.76,23.19-41.23,12.37-63.22-14.45-29.52-46.95-31.25-75.1-22.56-21.9,6.78-31.16-27.44-9.44-34.18,46.24-14.32,97.13-2.53,117.88,44.73,16,36.57,8.64,79.04-24.16,103.2Z"/><path d="M571.05,229.64c-8.91,4.92-17.38,11.66-25.22,19.28,7.09-8.16,15.74-14.76,25.22-19.28Z"/></svg><div style="font-size:11px;color:var(--sub);letter-spacing:1px;margin-bottom:22px;">MI OFICINA · CONCIENCIA EN ACCIÓN</div><input id="lg_mail" type="email" placeholder="Correo" autocomplete="username"><input id="lg_pass" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="cta" id="lg_go">Entrar</button><a href="mailto:ezequiel135@hotmail.com?subject=Solicito%20acceso%20a%20VICO%20%C2%B7%20Mi%20Oficina&body=Hola!%20Me%20gustar%C3%ADa%20solicitar%20acceso%20a%20la%20app%20VICO%20%C2%B7%20Mi%20Oficina.%20Mi%20correo%20es%3A%20" class="cta" style="display:block;box-sizing:border-box;text-decoration:none;background:var(--accent);color:var(--brand);margin-top:10px;">Solicitar acceso</a><div id="lg_msg" style="color:#b3423a;font-size:13px;margin-top:10px;min-height:18px;">${msg||''}</div></div>`;
  const go=()=>{ const m=document.getElementById('lg_mail').value.trim(), p=document.getElementById('lg_pass').value; if(!m||!p) return;
    signInWithEmailAndPassword(auth,m,p).catch(()=>{ document.getElementById('lg_msg').textContent='Correo o contraseña incorrectos.'; }); };
  document.getElementById('lg_go').addEventListener('click',go);
  document.getElementById('lg_pass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}
function addOut(){
  if(document.getElementById('outBtn')) return;
  const b=document.createElement('button'); b.id='outBtn'; b.textContent='Salir';
  b.style.cssText='background:none;border:none;color:var(--sub);font-size:12px;';
  b.addEventListener('click',async()=>{ if(!confirm('¿Cerrar sesión en este dispositivo?')) return; await signOut(auth); ['personas','eventos','bloques','config'].forEach(k=>{try{localStorage.removeItem('vico_'+k);}catch(e){}}); location.reload(); });
  document.querySelector('header.top').appendChild(b);
}
function listen(){
  const dirKey='vico_dirname_set_'+uid;
  if(!localStorage.getItem(dirKey)){
    let nombre=prompt('¿Cómo querés que te vean los demás en los mensajes?', (auth.currentUser&&auth.currentUser.email||'').split('@')[0]);
    nombre=(nombre||'Usuario').trim()||'Usuario';
    window.miNombre=nombre;
    setDoc(doc(fs,'directorio',uid),{nombre,email:(auth.currentUser&&auth.currentUser.email)||''}).catch(()=>{});
    try{localStorage.setItem(dirKey,nombre);}catch(e){}
  } else {
    window.miNombre=localStorage.getItem(dirKey);
  }
  window.miUid=uid;
  unsubs.push(onSnapshot(collection(fs,'directorio'),snap=>{
    window.directorio=snap.docs.map(d=>({uid:d.id,...d.data()}));
    if(tab==='mensajes'||tab==='nuevomsg') render();
  },()=>{}));
  unsubs.push(onSnapshot(query(collection(fs,'mensajes'),orderBy('fecha','desc'),limit(200)),snap=>{
    window.mensajes=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(tab==='mensajes') render();
  },()=>{}));
  const merged=localStorage.getItem('vico_merged_'+uid);
  ['personas','eventos','bloques','metas','biblioteca','campanas','rutinas'].forEach(n=>{
    unsubs.push(onSnapshot(ref(n),snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!first[n]){
        if(snap.metadata.fromCache && !snap.exists()) return;
        first[n]=true; done++;
        let cloud=snap.exists()?(snap.data().items||[]):[];
        if(!merged){ const ids=new Set(cloud.map(x=>x.id)); const extra=cur(n).filter(x=>!ids.has(x.id)); if(extra.length){ cloud=cloud.concat(extra); push(n,{items:clone(cloud)}); } }
        if(done===7) try{localStorage.setItem('vico_merged_'+uid,'1');}catch(e){}
        setCur(n,cloud); render(); return;
      }
      setCur(n,snap.exists()?(snap.data().items||[]):[]); render();
    },()=>{}));
  });
  unsubs.push(onSnapshot(ref('config'),snap=>{
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists()){ config=snap.data(); try{localStorage.setItem('vico_config',JSON.stringify(config));}catch(e){} }
    else if(config.paraQue||config.vision) push('config',{paraQue:config.paraQue||'', vision:config.vision||''});
    render();
  },()=>{}));
}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f()); unsubs=[]; first={}; done=0;
  if(u){ uid=u.uid; lr.style.display='none'; addOut(); listen(); }
  else { uid=null; showLogin(); }
});
</script>
