<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VICO · Mi Oficina</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VICO">
<meta name="theme-color" content="#8b3a62">
<meta name="description" content="VICO · Mi Oficina — oficina personal para gestionar tu negocio">
<style>
  :root{
    --bg:#fdf6f3; --card:#ffffff; --ink:#2e2430; --sub:#8a7a86;
    --brand:#8b3a62; --brand2:#c9748f; --accent:#f4e3e8; --line:#f0e2e6;
    --ok:#5c9c7c; --warn:#c98a4a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#1c1620; --card:#271f2c; --ink:#f2e9ee; --sub:#b6a5b1;
      --accent:#3a2530; --line:#3a2e38;
    }
  }
  :root[data-theme="dark"]{
    --bg:#1c1620; --card:#271f2c; --ink:#f2e9ee; --sub:#b6a5b1;
    --accent:#3a2530; --line:#3a2e38;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  #app{display:flex; flex-direction:column; height:100%; max-width:480px; margin:0 auto; position:relative;}
  header.top{
    padding:18px 18px 10px; display:flex; align-items:center; justify-content:space-between;
  }
  header.top h1{font-size:20px; margin:0; letter-spacing:.5px; color:var(--brand);}
  header.top span{font-size:11px; color:var(--sub); letter-spacing:1px;}
  main{flex:1; overflow-y:auto; padding:0 16px 90px;}
  .card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--line);}
  .paraque{background:var(--accent); border-radius:16px; padding:14px 16px; margin-bottom:14px; font-size:14px; color:var(--brand); line-height:1.4;}
  .row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--brand2); flex:none;}
  .row .t{font-size:14px; flex:1;}
  .row .sub{font-size:12px; color:var(--sub);}
  .section-title{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--sub); margin:4px 0 8px;}
  .stat3{display:flex; gap:10px; margin-bottom:14px;}
  .stat3 .box{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center;}
  .stat3 .box b{display:block; font-size:20px; color:var(--brand);}
  .stat3 .box small{font-size:11px; color:var(--sub);}
  .cta{display:block; width:100%; padding:14px; border:none; border-radius:14px; background:var(--brand); color:#fff; font-size:15px; font-weight:600; margin-top:4px;}
  input,select,textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:14px; margin-bottom:10px;
  }
  .searchbar{position:sticky; top:0; background:var(--bg); padding:10px 0;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px;}
  .chip{flex:none; padding:6px 14px; border-radius:20px; background:var(--card); border:1px solid var(--line); font-size:13px; color:var(--sub);}
  .chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .persona{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .persona .av{width:38px; height:38px; border-radius:50%; background:var(--brand2); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex:none;}
  .persona .info{flex:1; min-width:0;}
  .persona .info .n{font-size:14px; font-weight:600;}
  .persona .info .m{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tag{font-size:10px; padding:2px 8px; border-radius:10px; background:var(--accent); color:var(--brand); display:inline-block; margin-top:2px;}
  .fab{position:fixed; right:calc((100vw - 480px)/2 + 20px); bottom:calc(90px + env(safe-area-inset-bottom,0px)); width:52px; height:52px; border-radius:50%; background:var(--brand); color:#fff; border:none; font-size:24px;}
  @media (max-width:520px){.fab{right:20px;}}
  nav.bottom{
    position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center;
    gap:2px; color:var(--sub); font-size:10px; padding:4px;
  }
  nav.bottom button.active{color:var(--brand); font-weight:600;}
  nav.bottom .ic{font-size:18px;}
  .empty{text-align:center; color:var(--sub); font-size:13px; padding:24px 0;}
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:50;}
  .sheet{background:var(--card); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:18px; max-height:85vh; overflow-y:auto; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));}
  .sheet h3{margin:0 0 12px; color:var(--brand);}
  .sheet .actions{display:flex; gap:10px; margin-top:6px;}
  .sheet .actions button{flex:1; padding:12px; border-radius:10px; border:none; font-size:14px;}
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-secondary{background:var(--accent); color:var(--brand);}
  .detail-hist{font-size:13px; padding:8px 0; border-bottom:1px solid var(--line);}
  .detail-hist .d{color:var(--sub); font-size:11px;}
  .close-x{position:absolute; top:14px; right:16px; background:none; border:none; font-size:20px; color:var(--sub);}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div><h1>VICO</h1><span>MI OFICINA</span></div>
  </header>
  <main id="main"></main>
  <button class="fab" id="fab" style="display:none">+</button>
  <nav class="bottom">
    <button data-tab="inicio" class="active"><span class="ic">🏠</span>Inicio</button>
    <button data-tab="personas"><span class="ic">👥</span>Personas</button>
    <button data-tab="agenda"><span class="ic">📅</span>Agenda</button>
    <button data-tab="mas"><span class="ic">⋯</span>Más</button>
  </nav>
</div>
<div id="modalRoot"></div>

<script>
let personas = [], eventos = [], config = {paraQue:""};
let tab = "inicio", filtro = "Todos";

const $main = document.getElementById('main');
const todayStr = () => new Date().toISOString().slice(0,10);
const fmtFecha = (s) => { if(!s) return ""; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); };
const initials = (n) => (n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function repoInfo(p){
  if(!p.ultimaCompra||!p.ciclo) return null;
  const d=new Date(p.ultimaCompra+"T00:00:00"); d.setDate(d.getDate()+Number(p.ciclo));
  const hoy=new Date(todayStr()+"T00:00:00");
  return {fecha:d.toISOString().slice(0,10), dias:Math.round((d-hoy)/86400000)};
}
function repoTxt(p){ const r=repoInfo(p); if(!r) return 'Sin ciclo definido'; return r.dias<0?`Reposición vencida hace ${-r.dias} días`:r.dias===0?'Reposición hoy':`Reposición en ${r.dias} días`; }
let bloques=[]; try{ bloques=JSON.parse(localStorage.getItem('vico_bloques')||'[]'); }catch(e){}
function saveBloques(){ try{ localStorage.setItem('vico_bloques', JSON.stringify(bloques)); }catch(e){} }
// Almacenamiento local (queda guardado en este teléfono/navegador)
function loadLocal(){
  try{ personas = JSON.parse(localStorage.getItem('vico_personas')||'[]'); }catch(e){ personas = []; }
  try{ eventos = JSON.parse(localStorage.getItem('vico_eventos')||'[]'); }catch(e){ eventos = []; }
  try{ config = JSON.parse(localStorage.getItem('vico_config')||'{"paraQue":""}'); }catch(e){ config = {paraQue:""}; }
}
function savePersonas(){ try{ localStorage.setItem('vico_personas', JSON.stringify(personas)); }catch(e){} }
function saveEventos(){ try{ localStorage.setItem('vico_eventos', JSON.stringify(eventos)); }catch(e){} }
function saveConfig(){ try{ localStorage.setItem('vico_config', JSON.stringify(config)); }catch(e){} }

async function boot(){
  loadLocal();
  document.querySelectorAll('nav.bottom button').forEach(b=>{
    b.addEventListener('click', ()=>{ tab=b.dataset.tab; render(); });
  });
  document.getElementById('fab').addEventListener('click', ()=> openPersonaForm());
  render();
}

function render(){
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===(tab==='clientes'?'mas':tab)));
  document.getElementById('fab').style.display = tab==='personas' ? 'flex' : 'none';
  if(tab==='inicio') renderInicio();
  else if(tab==='personas') renderPersonas();
  else if(tab==='agenda') renderAgenda();
  else if(tab==='clientes') renderClientes();
  else renderMas();
}

function renderInicio(){
  const hoy = todayStr();
  const eventosHoy = eventos.filter(e=>e.fecha===hoy).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
  const seguimientos = personas.filter(p=>p.proximaFecha && p.proximaFecha<=hoy);
  const d = new Date();
  const fechaLarga = d.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'});

  $main.innerHTML = `
    <div class="card" style="text-align:center; padding:20px 16px;">
      <div style="font-size:16px; font-weight:600;">¡Buenos días, Vico! 💜</div>
      <div style="font-size:13px; color:var(--sub); text-transform:capitalize;">${fechaLarga}</div>
    </div>
    <div class="paraque">
      <b>MI PARA QUÉ</b><br>${config.paraQue ? config.paraQue : 'Tocá para escribir tu para qué (en Más → Mi Visión, próximamente). Por ahora podés escribirlo aquí abajo.'}
      <div style="margin-top:8px;"><input id="paraQueInput" placeholder="Escribe tu para qué..." value="${(config.paraQue||'').replace(/"/g,'&quot;')}"/></div>
    </div>
    <div class="stat3">
      <div class="box"><b>${seguimientos.length}</b><small>Seguimientos</small></div>
      <div class="box"><b>${eventosHoy.length}</b><small>Hoy en agenda</small></div>
      <div class="box"><b>${personas.filter(p=>{const r=repoInfo(p);return r&&r.dias<=7;}).length}</b><small>Reposiciones</small></div>
    </div>
    <div class="section-title">Hoy en tu agenda</div>
    <div class="card">
      ${eventosHoy.length ? eventosHoy.map(e=>`<div class="row"><span class="dot"></span><div><div class="t">${e.hora||''} · ${e.titulo}</div><div class="sub">${e.tipo||''}</div></div></div>`).join('') : '<div class="empty">Nada agendado para hoy</div>'}
    </div>
    <div class="section-title">Seguimientos pendientes</div>
    <div class="card">
      ${seguimientos.length ? seguimientos.map(p=>`<div class="row" data-open="${p.id}"><span class="dot"></span><div><div class="t">${p.nombre}</div><div class="sub">${p.proximaAccion||'Retomar contacto'}</div></div></div>`).join('') : '<div class="empty">Sin pendientes vencidos 🎉</div>'}
    </div>
    <button class="cta" id="moverBtn">🔥 MOVER MI OFICINA</button>
  `;
  document.getElementById('moverBtn').addEventListener('click', openMover);
  const pq = document.getElementById('paraQueInput');
  pq.addEventListener('change', ()=>{ config.paraQue = pq.value; saveConfig(); });
  $main.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>openPersonaDetail(el.dataset.open)));
}

function renderPersonas(){
  const cats = ["Todos","Cliente","Potencial","Socia"];
  const list = personas.filter(p => filtro==="Todos" || p.tipo===filtro)
    .sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  $main.innerHTML = `
    <div class="searchbar">
      <div class="chips">${cats.map(c=>`<div class="chip ${filtro===c?'active':''}" data-f="${c}">${c==="Todos"?"Todos":c+"s"}</div>`).join('')}</div>
    </div>
    <div class="card" style="padding:6px 4px;">
      ${list.length ? list.map(p=>`
        <div class="persona" data-open="${p.id}">
          <div class="av">${initials(p.nombre)}</div>
          <div class="info">
            <div class="n">${p.nombre}</div>
            <div class="m">${p.ultimaNota || p.telefono || ''}</div>
            ${p.tipo?`<span class="tag">${p.tipo}</span>`:''}
          </div>
        </div>`).join('') : '<div class="empty">Todavía no hay personas. Tocá + para agregar.</div>'}
    </div>
  `;
  $main.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('click', ()=>{ filtro=el.dataset.f; renderPersonas(); }));
  $main.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>openPersonaDetail(el.dataset.open)));
}

function renderAgenda(){
  const hoy = todayStr();
  const prox = eventos.filter(e=>e.fecha>=hoy).sort((a,b)=> (a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  $main.innerHTML = `
    <div class="section-title">Próximos eventos</div>
    <div class="card">
      ${prox.length ? prox.map(e=>`<div class="row"><span class="dot"></span><div><div class="t">${fmtFecha(e.fecha)} · ${e.hora||''} — ${e.titulo}</div><div class="sub">${e.tipo||''}</div></div></div>`).join('') : '<div class="empty">Sin eventos próximos</div>'}
    </div>
    <button class="cta" id="addEvt">+ Agendar evento</button>
  `;
  document.getElementById('addEvt').addEventListener('click', openEventoForm);
}

function renderMas(){
  const items = ["Clientes","Equipo / Socias","Metas","Mi Visión / Mapa de sueños","Biblioteca","Campañas","Estadísticas"];
  $main.innerHTML = `
    <div class="section-title">Más módulos</div>
    <div class="card">
      <div class="row" id="goCli"><span class="dot"></span><div><div class="t">Clientes</div><div class="sub">Reposiciones y recompras</div></div></div>
      ${items.filter(i=>i!=="Clientes").map(i=>`<div class="row"><span class="dot" style="background:var(--sub)"></span><div><div class="t">${i}</div><div class="sub">Próximamente</div></div></div>`).join('')}
    </div>
  `;
  document.getElementById('goCli').addEventListener('click', ()=>{ tab='clientes'; render(); });
}

function renderClientes(){
  const f=window.cf||'Todos';
  let list=personas.filter(p=>p.tipo==='Cliente').map(p=>({p,r:repoInfo(p)}));
  if(f==='Para reponer') list=list.filter(x=>x.r&&x.r.dias<=7);
  if(f==='Consumiendo') list=list.filter(x=>x.r&&x.r.dias>7);
  list.sort((a,b)=>(a.r?a.r.dias:9999)-(b.r?b.r.dias:9999));
  $main.innerHTML=`<div class="chips"><div class="chip" id="back">← Más</div>${['Todos','Para reponer','Consumiendo'].map(c=>`<div class="chip ${f===c?'active':''}" data-cf="${c}">${c}</div>`).join('')}</div>
  <div class="card" style="padding:6px 4px;">${list.length?list.map(({p,r})=>`<div class="persona" data-open="${p.id}"><div class="av">${initials(p.nombre)}</div><div class="info"><div class="n">${p.nombre}</div><div class="m">${p.producto||'Sin producto'} · ${repoTxt(p)}</div>${r&&r.dias<=7?'<span class="tag">Reponer</span>':''}</div></div>`).join(''):'<div class="empty">Sin clientes aquí. Abrí una persona y completá producto, compra y ciclo.</div>'}</div>`;
  document.getElementById('back').addEventListener('click',()=>{tab='mas';render();});
  $main.querySelectorAll('[data-cf]').forEach(el=>el.addEventListener('click',()=>{window.cf=el.dataset.cf;renderClientes();}));
  $main.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>openPersonaDetail(el.dataset.open)));
}

function openMover(){
  const m={paso:0,intencion:'',foco:'',elegidas:[],pid:'',motivo:'',cierre:'',proximo:''};
  const focos=['Clientes','Seguimientos','Negocio','Equipo','Campaña'], motivos=['Reposición','Nuevo producto','Reactivación','Referido','Negocio','Seguimiento'];
  const titulos=['Intención','Elijo mi foco','Personas sugeridas','Acción','Cierre'];
  const sug=()=>{ const hoy=todayStr(); const a=personas.filter(p=>(p.proximaFecha&&p.proximaFecha<=hoy)||(repoInfo(p)&&repoInfo(p).dias<=7)); const b=personas.filter(p=>!a.includes(p)&&p.tipo!=='Socia'); return a.concat(b).slice(0,5); };
  const draw=()=>{
    let body='';
    if(m.paso===0) body=`<p class="sub">Abrí tu cuaderno. ¿Qué querés mover hoy?</p><textarea id="m_int" rows="3" placeholder="Hoy quiero...">${m.intencion}</textarea>`;
    if(m.paso===1) body=`<div class="chips" style="flex-wrap:wrap">${focos.map(x=>`<div class="chip ${m.foco===x?'active':''}" data-foco="${x}">${x}</div>`).join('')}</div>`;
    if(m.paso===2){ const l=sug(); body=l.length?l.map(p=>`<div class="persona" data-sel="${p.id}"><div class="av" style="${m.elegidas.includes(p.id)?'':'opacity:.4'}">${m.elegidas.includes(p.id)?'✓':initials(p.nombre)}</div><div class="info"><div class="n">${p.nombre}</div><div class="m">${p.proximaAccion||repoTxt(p)}</div></div></div>`).join(''):'<div class="empty">Cargá personas primero en la pestaña Personas.</div>'; }
    if(m.paso===3){ const l=personas.filter(p=>m.elegidas.includes(p.id)); const pp=l.length?l:personas; const per=personas.find(x=>x.id===m.pid);
      body=`<select id="m_p"><option value="">Elegí una persona</option>${pp.map(p=>`<option value="${p.id}" ${m.pid===p.id?'selected':''}>${p.nombre}</option>`).join('')}</select><div class="chips" style="flex-wrap:wrap">${motivos.map(x=>`<div class="chip ${m.motivo===x?'active':''}" data-mot="${x}">${x}</div>`).join('')}</div><p class="sub">Una persona, un motivo, una conversación.</p>${per&&per.telefono?`<a class="cta" style="text-align:center;text-decoration:none" target="_blank" href="https://wa.me/${per.telefono.replace(/\D/g,'')}">Abrir WhatsApp</a>`:''}`; }
    if(m.paso===4) body=`<p class="sub">Revisá lo que hiciste y tu próximo paso.</p><textarea id="m_cie" rows="3" placeholder="Qué hice / cómo salió">${m.cierre}</textarea><textarea id="m_pro" rows="2" placeholder="Próximo paso">${m.proximo}</textarea>`;
    openModal(`<button class="close-x" onclick="closeModal()">✕</button><h3>0${m.paso+1} · ${titulos[m.paso]}</h3>${body}<div class="actions">${m.paso>0?'<button class="btn-secondary" id="m_prev">Atrás</button>':''}<button class="btn-primary" id="m_next">${m.paso===4?'Terminar':'Siguiente'}</button></div>`);
    const g=id=>document.getElementById(id);
    document.querySelectorAll('[data-foco]').forEach(e=>e.addEventListener('click',()=>{m.foco=e.dataset.foco;draw();}));
    document.querySelectorAll('[data-mot]').forEach(e=>e.addEventListener('click',()=>{m.motivo=e.dataset.mot;if(g('m_p'))m.pid=g('m_p').value;draw();}));
    document.querySelectorAll('[data-sel]').forEach(e=>e.addEventListener('click',()=>{const i=e.dataset.sel;m.elegidas=m.elegidas.includes(i)?m.elegidas.filter(x=>x!==i):m.elegidas.concat(i);draw();}));
    if(g('m_prev')) g('m_prev').addEventListener('click',()=>{ m.paso--; draw(); });
    g('m_next').addEventListener('click',()=>{
      if(g('m_int')) m.intencion=g('m_int').value; if(g('m_p')) m.pid=g('m_p').value;
      if(g('m_cie')){ m.cierre=g('m_cie').value; m.proximo=g('m_pro').value; }
      if(m.paso<4){ m.paso++; draw(); return; }
      const per=personas.find(x=>x.id===m.pid);
      if(per){ per.historial=(per.historial||[]).concat({fecha:todayStr(),texto:(m.motivo?m.motivo+': ':'')+(m.cierre||'Bloque de trabajo')}); per.ultimaNota=m.cierre||per.ultimaNota; if(m.proximo) per.proximaAccion=m.proximo; savePersonas(); }
      bloques.push({fecha:todayStr(),intencion:m.intencion,foco:m.foco,motivo:m.motivo,pid:m.pid,cierre:m.cierre,proximo:m.proximo}); saveBloques();
      closeModal(); render();
    });
  };
  draw();
}

function openModal(html){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="backdrop" id="bd"><div class="sheet">${html}</div></div>`;
  document.getElementById('bd').addEventListener('click', (e)=>{ if(e.target.id==='bd') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

function openPersonaForm(){
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>Nueva persona</h3>
    <input id="f_nombre" placeholder="Nombre">
    <input id="f_telefono" placeholder="Teléfono (opcional)">
    <select id="f_tipo">
      <option value="Potencial">Potencial</option>
      <option value="Cliente">Cliente</option>
      <option value="Socia">Socia</option>
    </select>
    <textarea id="f_nota" placeholder="Nota inicial / cómo la conozco" rows="2"></textarea>
    <div class="actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" id="saveP">Guardar</button>
    </div>
  `);
  document.getElementById('saveP').addEventListener('click', ()=>{
    const nombre = document.getElementById('f_nombre').value.trim();
    if(!nombre) return;
    const nota = document.getElementById('f_nota').value.trim();
    const data = {
      id: uid(), nombre,
      telefono: document.getElementById('f_telefono').value.trim(),
      tipo: document.getElementById('f_tipo').value,
      ultimaNota: nota,
      historial: nota ? [{fecha: todayStr(), texto: nota}] : [],
      proximaAccion:"", proximaFecha:""
    };
    personas.push(data);
    savePersonas();
    closeModal();
    render();
  });
}

function openPersonaDetail(id){
  const p = personas.find(x=>x.id===id);
  if(!p) return;
  const hist = (p.historial||[]).slice().reverse();
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>${p.nombre}</h3>
    <div class="sub" style="margin-bottom:10px;">${p.tipo||''} ${p.telefono?(' · '+p.telefono):''}</div>
    <div class="section-title">Próxima acción</div>
    <input id="d_accion" placeholder="Ej: Escribirle para retomar" value="${(p.proximaAccion||'').replace(/"/g,'&quot;')}">
    <input id="d_fecha" type="date" value="${p.proximaFecha||''}">
    <div class="section-title">Compra / reposición</div>
    <input id="d_prod" placeholder="Producto (ej: AP24, ageLOC)" value="${(p.producto||'').replace(/"/g,'&quot;')}">
    <div style="display:flex;gap:8px;"><input id="d_compra" type="date" value="${p.ultimaCompra||''}"><input id="d_ciclo" type="number" min="1" placeholder="Ciclo (días)" value="${p.ciclo||''}"></div>
    <div class="section-title">Agregar al historial</div>
    <textarea id="d_nueva" placeholder="Qué pasó / qué se dijo" rows="2"></textarea>
    <div class="actions">
      <button class="btn-secondary" id="delP">Eliminar</button>
      <button class="btn-primary" id="saveD">Guardar</button>
    </div>
    <div class="section-title" style="margin-top:14px;">Historial</div>
    ${hist.length ? hist.map(h=>`<div class="detail-hist"><div class="d">${fmtFecha(h.fecha)}</div>${h.texto}</div>`).join('') : '<div class="empty">Sin historial aún</div>'}
  `);
  document.getElementById('saveD').addEventListener('click', ()=>{
    const nuevaTexto = document.getElementById('d_nueva').value.trim();
    const historial = (p.historial||[]).slice();
    if(nuevaTexto) historial.push({fecha: todayStr(), texto: nuevaTexto});
    p.proximaAccion = document.getElementById('d_accion').value.trim();
    p.proximaFecha = document.getElementById('d_fecha').value;
    p.historial = historial;
    p.producto=document.getElementById('d_prod').value.trim(); p.ultimaCompra=document.getElementById('d_compra').value; p.ciclo=document.getElementById('d_ciclo').value;
    if(p.ultimaCompra&&p.tipo==='Potencial') p.tipo='Cliente';
    if(nuevaTexto) p.ultimaNota = nuevaTexto;
    savePersonas();
    closeModal();
    render();
  });
  document.getElementById('delP').addEventListener('click', ()=>{
    personas = personas.filter(x=>x.id!==id);
    savePersonas();
    closeModal();
    render();
  });
}

function openEventoForm(){
  const opciones = personas.map(p=>`<option value="${p.id}">${p.nombre}</option>`).join('');
  openModal(`
    <button class="close-x" onclick="closeModal()">✕</button>
    <h3>Agendar evento</h3>
    <input id="e_titulo" placeholder="Título (ej: Llamada con...)">
    <select id="e_tipo">
      <option>Llamada</option><option>Reunión</option><option>Seguimiento</option>
      <option>Capacitación</option><option>Evento</option><option>1:1</option><option>Tarea</option>
    </select>
    <input id="e_fecha" type="date" value="${todayStr()}">
    <input id="e_hora" type="time">
    <select id="e_persona"><option value="">— Sin vincular —</option>${opciones}</select>
    <div class="actions">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" id="saveE">Guardar</button>
    </div>
  `);
  document.getElementById('saveE').addEventListener('click', ()=>{
    const titulo = document.getElementById('e_titulo').value.trim();
    if(!titulo) return;
    const data = {
      id: uid(), titulo, tipo: document.getElementById('e_tipo').value,
      fecha: document.getElementById('e_fecha').value,
      hora: document.getElementById('e_hora').value,
      personaId: document.getElementById('e_persona').value
    };
    eventos.push(data);
    saveEventos();
    closeModal();
    render();
  });
}

boot();
</script>
</body>
</html>
