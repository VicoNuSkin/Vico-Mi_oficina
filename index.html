  header.top h1{margin:0 0 2px;}
  header.top span{font-size:11px; color:var(--sub); letter-spacing:1px; display:block;}
  header.top .tagline{font-size:9px; color:var(--brand2); letter-spacing:1.5px; margin-top:1px;}
  .vico-mark{width:110px; height:auto; fill:var(--brand); display:block;}
  .vico-mark-lg{width:150px; height:auto; fill:var(--brand); display:block; margin:0 auto 6px;}
  main{flex:1; overflow-y:auto; padding:0 16px 90px;}
  .card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--line);}
  .paraque{background:var(--accent); border-radius:16px; padding:14px 16px; margin-bottom:14px; font-size:14px; color:var(--brand); line-height:1.4;}
  .row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--brand2); flex:none;}
  .row .t{font-size:14px; flex:1;}
  .row .sub{font-size:12px; color:var(--sub);}
  .section-title{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--sub); margin:4px 0 8px;}
  .stat3{display:flex; gap:10px; margin-bottom:14px;}

  .stat3 .box b{display:block; font-size:20px; color:var(--brand);}
  .stat3 .box small{font-size:11px; color:var(--sub);}
  .cta{display:block; width:100%; padding:14px; border:none; border-radius:14px; background:var(--brand); color:#fff; font-size:15px; font-weight:600; margin-top:4px; cursor:pointer;}
  input,select,textarea{

    background:var(--bg); color:var(--ink); font-size:14px; margin-bottom:10px;
  }
  .searchbar{position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:10;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px;}
  .chip{flex:none; padding:6px 14px; border-radius:20px; background:var(--card); border:1px solid var(--line); font-size:13px; color:var(--sub); cursor:pointer;}
  .chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .persona{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer;}
  .persona .av{width:38px; height:38px; border-radius:50%; background:var(--brand2); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex:none;}
  .persona .info{flex:1; min-width:0;}
  .persona .info .n{font-size:14px; font-weight:600;}
  .persona .info .m{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tag{font-size:10px; padding:2px 8px; border-radius:10px; background:var(--accent); color:var(--brand); display:inline-block; margin-top:2px;}

  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center;
    gap:2px; color:var(--sub); font-size:10px; padding:4px; cursor:pointer;
  }
  nav.bottom button.active{color:var(--brand); font-weight:600;}
  nav.bottom .ic{font-size:18px;}
  .empty{text-align:center; color:var(--sub); font-size:13px; padding:24px 0;}
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:50;}
  .sheet{position:relative; background:var(--card); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:18px; max-height:85vh; overflow-y:auto; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));}

  .sheet .actions button{flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; cursor:pointer;}
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-secondary{background:var(--accent); color:var(--brand);}
  .detail-hist{font-size:13px; padding:8px 0; border-bottom:1px solid var(--line);}
  .detail-hist .d{color:var(--sub); font-size:11px;}
  .close-x{position:absolute; top:10px; right:10px; background:var(--accent); border:none; font-size:18px; color:var(--brand); width:30px; height:30px; border-radius:50%; z-index:5; cursor:pointer;}

    .list-grid .persona{ border:1px solid var(--line); border-radius:12px; padding:12px; margin:0; flex-direction:column; align-items:flex-start; gap:4px; min-width:0; }
    .list-grid .row{ border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin:0; min-width:0; }
    .list-grid .persona .info{ min-width:0; width:100%; }

    .list-grid .row > div{ min-width:0; }
    .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:20px; align-items:start; }

function loadLocal(){

async function boot(){
  loadLocal();
  document.querySelectorAll('nav.bottom button').forEach(b=>{
    b.addEventListener('click', ()=>{ tab=b.dataset.tab; render(); });
  });
  const fab = document.getElementById('fab');
  if(fab) fab.addEventListener('click', ()=> openPersonaForm());
  render();
}

function render(){
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===(tab==='clientes'?'mas':tab)));
  const fab = document.getElementById('fab');
  if(fab) fab.style.display = tab==='personas' ? 'flex' : 'none';
  if(tab==='inicio') renderInicio();
  else if(tab==='personas') renderPersonas();
  else if(tab==='agenda') renderAgenda();
  else if(tab==='clientes') renderClientes();
  else if(tab==='metas') renderMetas();
  else if(tab==='equipo') renderEquipo();
  else if(tab==='biblioteca') renderBiblioteca();
  else if(tab==='estadisticas') renderEstadisticas();
  else if(tab==='campanas') renderCampanas();
  else if(tab==='campdet') renderCampanaDetail(window.curCamp);
  else if(tab==='qr') renderQR();
  else if(tab==='mensajes') renderMensajes();
  else if(tab==='mfoco') renderMFoco();
  else if(tab==='mrutinas') renderMRutinas();
  else if(tab==='macciones') renderMAcciones();
  else if(tab==='mtrabajo') renderMTrabajo();
  else if(tab==='mresumen') renderMResumen();
  else if(tab==='historial') renderHistorial();
  else if(tab==='progreso') renderProgreso();
  else renderMas();
}

function renderInicio(){
  const hoy = todayStr();
  const hoyM = madridNow().fecha;
  const eventosHoy = eventos.filter(e=>e.fecha===hoyM).sort((a,b)=>(a.hora||"").localeCompare(b.hora||""));
  const seguimientos = personas.filter(p=>p.proximaFecha && p.proximaFecha<=hoy);
  const bloquesHoy = bloques.filter(b=>b.fecha===hoyM && b.horaInicio);
  const minHoy = bloquesHoy.reduce((s,b)=>s+(b.tiempoRealMin||0),0);
  const accHoy = bloquesHoy.reduce((s,b)=>s+(b.acciones||[]).filter(a=>a.hecho>0).length,0);
  const d = new Date();
  const fechaLarga = d.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'});

  $main.innerHTML = `
    <div class="card" style="text-align:center; padding:20px 16px;">
      <div style="font-size:16px; font-weight:600;">¡Buenos días, Vico! 💜</div>
      <div style="font-size:13px; color:var(--sub); text-transform:capitalize;">${fechaLarga}</div>
    </div>
    <div class="paraque">
      <b>MI PARA QUÉ</b>
      ${window.editPQ || !config.paraQue ? `
        <div style="margin-top:8px;"><textarea id="paraQueInput" rows="3" placeholder="Escribe tu para qué...">${(config.paraQue||'').replace(/</g,'&lt;')}</textarea></div>
        <button class="cta" id="savePQ" style="margin-top:4px;">Guardar</button>
      ` : `
        <div style="margin-top:6px; white-space:pre-wrap;">${config.paraQue}</div>
        <span id="editPQ" style="display:inline-block;margin-top:8px;font-size:12px;font-weight:600;color:var(--brand2);">EDITAR</span>
      `}
    </div>
    <div class="stat3">
      <div class="box"><b>${seguimientos.length}</b><small>Seguimientos</small></div>
      <div class="box"><b>${eventosHoy.length}</b><small>Hoy en agenda</small></div>
      <div class="box"><b>${personas.filter(p=>{const r=repoInfo(p);return r&&r.dias<=7;}).length}</b><small>Reposiciones</small></div>
    </div>
    <div class="two-col">
      <div>
        <div class="section-title">Hoy en tu agenda</div>
        <div class="card">
          ${eventosHoy.length ? eventosHoy.map(e=>`<div class="row"><span class="dot"></span><div style="flex:1;"><div class="t">${e.hora\vert{}\vert{}''} ·${e.titulo}</div><div class="sub">${e.tipo\vert{}\vert{}''}</div></div>${e.link?`<a href="${e.link}" target="_blank" style="color:var(--brand);font-size:12px;font-weight:600;text-decoration:none;">UNIRME</a>`:''}</div>`).join('') : '<div class="empty">Nada agendado para hoy</div>'}
        </div>
      </div>
      <div>
        <div class="section-title">Seguimientos pendientes</div>
        <div class="card">
          ${seguimientos.length ? seguimientos.map(p=>`<div class="row" data-open="${p.id}"><span class="dot"></span><div><div class="t">${p.nombre}</div><div class="sub">${p.proximaAccion||'Retomar contacto'}</div></div></div>`).join('') : '<div class="empty">Sin pendientes vencidos 🎉</div>'}
        </div>
      </div>
    </div>
    ${bloquesHoy.length?`<div class="paraque" style="text-align:center;">✨ HOY YA MOVISTE<br><b>${minHoy>=60?Math.floor(minHoy/60)+'h '+(minHoy\%60)+'min':minHoy+' min'} ·${accHoy} acciones</b></div>`:''}
    <button class="cta" id="moverBtn">🔥 MOVER MI OFICINA</button>
  `;
  document.getElementById('moverBtn').addEventListener('click', openMover);
  const pq = document.getElementById('paraQueInput');
  if(pq) pq.focus();
  const savePQ = document.getElementById('savePQ');
  if(savePQ) savePQ.addEventListener('click', ()=>{ config.paraQue = pq.value.trim(); window.editPQ=false; saveConfig(); renderInicio(); });
  const editPQ = document.getElementById('editPQ');
  if(editPQ) editPQ.addEventListener('click', ()=>{ window.editPQ=true; renderInicio(); });
  $main.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>openPersonaDetail(el.dataset.open)));
}
