function repoInfo(p){
  if(!p.ultimaCompra||!p.ciclo) return null;
  const d=new Date(p.ultimaCompra+"T00:00:00"); d.setDate(d.getDate()+Number(p.ciclo));
  const hoy=new Date(todayStr()+"T00:00:00");
  return {fecha:d.toISOString().slice(0,10), dias:Math.round((d-hoy)/86400000)};
}
function repoTxt(p){ const r=repoInfo(p); if(!r) return 'Sin ciclo definido'; return r.dias<0?`Reposición vencida hace ${-r.dias} días`:r.dias===0?'Reposición hoy':`Reposición en ${r.dias} días`; }

function loadLocal(){
  try{ personas = JSON.parse(localStorage.getItem('vico_personas')||'[]'); }catch(e){ personas = []; }
  try{ metas = JSON.parse(localStorage.getItem('vico_metas')||'[]'); }catch(e){ metas = []; }
  try{ biblioteca = JSON.parse(localStorage.getItem('vico_biblioteca')||'[]'); }catch(e){ biblioteca = []; }
  try{ eventos = JSON.parse(localStorage.getItem('vico_eventos')||'[]'); }catch(e){ eventos = []; }
  try{ config = JSON.parse(localStorage.getItem('vico_config')||'{"paraQue":""}'); }catch(e){ config = {paraQue:""}; }
}
function savePersonas(){ try{ localStorage.setItem('vico_personas', JSON.stringify(personas)); }catch(e){} }
function saveEventos(){ try{ localStorage.setItem('vico_eventos', JSON.stringify(eventos)); }catch(e){} }
function saveMetas(){ try{ localStorage.setItem('vico_metas', JSON.stringify(metas)); }catch(e){} }
function saveBiblioteca(){ try{ localStorage.setItem('vico_biblioteca', JSON.stringify(biblioteca)); }catch(e){} }

async function boot(){
  loadLocal();
  document.querySelectorAll('nav.bottom button').forEach(b=>{
    b.addEventListener('click', ()=>{ tab=b.dataset.tab; render(); });
  });
  document.getElementById('fab').addEventListener('click', ()=> openPersonaForm());
  render();
}

function render(){
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===(tab==='clientes'?'mas':tab)));
  document.getElementById('fab').style.display = tab==='personas' ? 'flex' : 'none';
  if(tab==='inicio') renderInicio();
  else if(tab==='personas') renderPersonas();
  else if(tab==='agenda') renderAgenda();
  else if(tab==='clientes') renderClientes();
  else if(tab==='metas') renderMetas();
  else if(tab==='equipo') renderEquipo();
  else if(tab==='biblioteca') renderBiblioteca();
  else if(tab==='estadisticas') renderEstadisticas();
  else renderMas();
}

function renderPersonas(){
  const cats = ["Todos","Cliente","Potencial","Socia"];
  const list = personas.filter(p => filtro==="Todos" || p.tipo===filtro)
    .sort((a,b)=>(a.nombre||"").localeCompare(b.nombre||""));
  $main.innerHTML = `
    <div class="searchbar">
      <div class="chips">${cats.map(c=>`<div class="chip ${filtro===c?'active':''}" data-f="${c}">${c==="Todos"?"Todos":c+"s"}</div>`).join('')}</div>
    </div>
    <div class="card" style="padding:6px 4px;">
      ${list.length ? list.map(p=>`
        <div class="persona" data-open="${p.id}">
          <div class="av">${initials(p.nombre)}</div>
          <div class="info">
            <div class="n">${p.nombre}</div>
            <div class="m">${p.ultimaNota || p.telefono || ''}</div>
            ${p.tipo?`<span class="tag">${p.tipo}</span>`:''}
          </div>
        </div>`).join('') : '<div class="empty">Todavía no hay personas. Tocá + para agregar.</div>'}
    </div>
  `;
  $main.querySelectorAll('[data-f]').forEach(el=>el.addEventListener('click', ()=>{ filtro=el.dataset.f; renderPersonas(); }));
  $main.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click', ()=>openPersonaDetail(el.dataset.open)));
}

  document.getElementById('goBib').addEventListener('click', ()=>{ tab='biblioteca'; render(); });
  document.getElementById('goEst').addEventListener('click', ()=>{ tab='estadisticas'; render(); });
  const di = document.getElementById('doImport');
  if(di) di.addEventListener('click', ()=>{
    if(!confirm('Se van a agregar '+IMPORT_DATA.length+' contactos como Potenciales. ¿Continuar?')) return;
    const existentes = new Set(personas.map(p=>(p.nombre||'').trim().toLowerCase()));
    let agregados=0;
    IMPORT_DATA.forEach(d=>{
      const key=d.nombre.trim().toLowerCase();
      if(existentes.has(key)) return;
      existentes.add(key);
      personas.push(Object.assign({id:uid()}, d));
      agregados++;
    });
    savePersonas();
    try{ localStorage.setItem('vico_import_done','1'); }catch(e){}
    closeModal();
    alert('Se agregaron '+agregados+' contactos nuevos.');
    tab='personas'; filtro='Potencial'; render();
  });
}

function openMover(){
  const m={paso:0,intencion:'',foco:'',elegidas:[],pid:'',motivo:'',cierre:'',proximo:''};
  const focos=['Clientes','Seguimientos','Negocio','Equipo','Formación','Campaña'], motivos=['Reposición','Nuevo producto','Reactivación','Referido','Negocio','Seguimiento'];
  const titulos=['Intención','Elijo mi foco','Personas sugeridas','Acción','Cierre'];
  const sug=()=>{ const hoy=todayStr(); const a=personas.filter(p=>(p.proximaFecha&&p.proximaFecha<=hoy)||(repoInfo(p)&&repoInfo(p).dias<=7)); const b=personas.filter(p=>!a.includes(p)&&p.tipo!=='Socia'); return a.concat(b).slice(0,5); };
  const draw=()=>{
    let body='';
    if(m.paso===0) body=`<p class="sub">Abrí tu cuaderno. ¿Qué querés mover hoy?</p><textarea id="m_int" rows="3" placeholder="Hoy quiero...">${m.intencion}</textarea>`;
    if(m.paso===1) body=`<div class="chips" style="flex-wrap:wrap">${focos.map(x=>`<div class="chip ${m.foco===x?'active':''}" data-foco="${x}">${x}</div>`).join('')}</div>`;
    if(m.paso===2){ const l=sug(); body=l.length?l.map(p=>`<div class="persona" data-sel="${p.id}"><div class="av" style="${m.elegidas.includes(p.id)?'':'opacity:.4'}">${m.elegidas.includes(p.id)?'✓':initials(p.nombre)}</div><div class="info"><div class="n">${p.nombre}</div><div class="m">${p.proximaAccion||repoTxt(p)}</div></div></div>`).join(''):'<div class="empty">Cargá personas primero en la pestaña Personas.</div>'; }
    if(m.paso===3){ const l=personas.filter(p=>m.elegidas.includes(p.id)); const pp=l.length?l:personas; const per=personas.find(x=>x.id===m.pid);
      body=`<select id="m_p"><option value="">Elegí una persona</option>${pp.map(p=>`<option value="${p.id}" ${m.pid===p.id?'selected':''}>${p.nombre}</option>`).join('')}</select><div class="chips" style="flex-wrap:wrap">${motivos.map(x=>`<div class="chip ${m.motivo===x?'active':''}" data-mot="${x}">${x}</div>`).join('')}</div><p class="sub">Una persona, un motivo, una conversación.</p>${per&&per.telefono?`<a class="cta" style="text-align:center;text-decoration:none" target="_blank" href="https://wa.me/${per.telefono.replace(/\D/g,'')}">Abrir WhatsApp</a>`:''}`; }
    if(m.paso===4) body=`<p class="sub">Revisá lo que hiciste y tu próximo paso.</p><textarea id="m_cie" rows="3" placeholder="Qué hice / cómo salió">${m.cierre}</textarea><textarea id="m_pro" rows="2" placeholder="Próximo paso">${m.proximo}</textarea>`;
    openModal(`<button class="close-x" onclick="closeModal()">✕</button><h3>0${m.paso+1} · ${titulos[m.paso]}</h3>${body}<div class="actions">${m.paso>0?'<button class="btn-secondary" id="m_prev">Atrás</button>':''}<button class="btn-primary" id="m_next">${m.paso===4?'Terminar':'Siguiente'}</button></div>`);
    const g=id=>document.getElementById(id);
    document.querySelectorAll('[data-foco]').forEach(e=>e.addEventListener('click',()=>{m.foco=e.dataset.foco;draw();}));
    document.querySelectorAll('[data-mot]').forEach(e=>e.addEventListener('click',()=>{m.motivo=e.dataset.mot;if(g('m_p'))m.pid=g('m_p').value;draw();}));
    document.querySelectorAll('[data-sel]').forEach(e=>e.addEventListener('click',()=>{const i=e.dataset.sel;m.elegidas=m.elegidas.includes(i)?m.elegidas.filter(x=>x!==i):m.elegidas.concat(i);draw();}));
    if(g('m_prev')) g('m_prev').addEventListener('click',()=>{ m.paso--; draw(); });
    g('m_next').addEventListener('click',()=>{
      if(g('m_int')) m.intencion=g('m_int').value; if(g('m_p')) m.pid=g('m_p').value;
      if(g('m_cie')){ m.cierre=g('m_cie').value; m.proximo=g('m_pro').value; }
      if(m.paso<4){ m.paso++; draw(); return; }
      const per=personas.find(x=>x.id===m.pid);
      if(per){ per.historial=(per.historial||[]).concat({fecha:todayStr(),texto:(m.motivo?m.motivo+': ':'')+(m.cierre||'Bloque de trabajo')}); per.ultimaNota=m.cierre||per.ultimaNota; if(m.proximo) per.proximaAccion=m.proximo; savePersonas(); }
      bloques.push({fecha:todayStr(),intencion:m.intencion,foco:m.foco,motivo:m.motivo,pid:m.pid,cierre:m.cierre,proximo:m.proximo}); saveBloques();
      closeModal(); render();
    });
  };
  draw();
}

const auth=getAuth(app);
const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
let uid=null, unsubs=[], first={}, done=0;
const ref=n=>doc(fs,'usuarios',uid,'datos',n);
const lr=document.getElementById('loginRoot');
const clone=x=>JSON.parse(JSON.stringify(x));
const push=(n,data)=>{ if(uid) setDoc(ref(n),data).catch(()=>{}); };
const cur=n=>n==='personas'?personas:n==='eventos'?eventos:n==='metas'?metas:n==='biblioteca'?biblioteca:bloques;
const setCur=(n,a)=>{ if(n==='personas'){personas=a;} else if(n==='eventos'){eventos=a;} else if(n==='metas'){metas=a;} else if(n==='biblioteca'){biblioteca=a;} else {bloques=a;} try{localStorage.setItem('vico_'+n,JSON.stringify(a));}catch(e){} };
window.savePersonas=()=>{ try{localStorage.setItem('vico_personas',JSON.stringify(personas));}catch(e){} push('personas',{items:clone(personas)}); };
window.saveEventos=()=>{ try{localStorage.setItem('vico_eventos',JSON.stringify(eventos));}catch(e){} push('eventos',{items:clone(eventos)}); };
window.saveMetas=()=>{ try{localStorage.setItem('vico_metas',JSON.stringify(metas));}catch(e){} push('metas',{items:clone(metas)}); };
window.saveBiblioteca=()=>{ try{localStorage.setItem('vico_biblioteca',JSON.stringify(biblioteca));}catch(e){} push('biblioteca',{items:clone(biblioteca)}); };
window.saveBloques=()=>{ try{localStorage.setItem('vico_bloques',JSON.stringify(bloques));}catch(e){} push('bloques',{items:clone(bloques)}); };
window.saveConfig=()=>{ try{localStorage.setItem('vico_config',JSON.stringify(config));}catch(e){} push('config',{paraQue:config.paraQue||''}); };

function showLogin(msg){
  lr.style.display='flex';
  lr.innerHTML=`<div style="width:100%;max-width:340px;text-align:center;"><h1 style="color:var(--brand);margin:0;letter-spacing:1px;">VICO</h1><div style="font-size:11px;color:var(--sub);letter-spacing:1px;margin-bottom:22px;">MI OFICINA</div><input id="lg_mail" type="email" placeholder="Correo" autocomplete="username"><input id="lg_pass" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="cta" id="lg_go">Entrar</button><div id="lg_msg" style="color:#b3423a;font-size:13px;margin-top:10px;min-height:18px;">${msg||''}</div></div>`;
  const go=()=>{ const m=document.getElementById('lg_mail').value.trim(), p=document.getElementById('lg_pass').value; if(!m||!p) return;
    signInWithEmailAndPassword(auth,m,p).catch(()=>{ document.getElementById('lg_msg').textContent='Correo o contraseña incorrectos.'; }); };
  document.getElementById('lg_go').addEventListener('click',go);
  document.getElementById('lg_pass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}
function addOut(){
  if(document.getElementById('outBtn')) return;
  const b=document.createElement('button'); b.id='outBtn'; b.textContent='Salir';
  b.style.cssText='background:none;border:none;color:var(--sub);font-size:12px;';
  b.addEventListener('click',async()=>{ if(!confirm('¿Cerrar sesión en este dispositivo?')) return; await signOut(auth); ['personas','eventos','bloques','config'].forEach(k=>{try{localStorage.removeItem('vico_'+k);}catch(e){}}); location.reload(); });
  document.querySelector('header.top').appendChild(b);
}
function listen(){
  const merged=localStorage.getItem('vico_merged_'+uid);
  ['personas','eventos','bloques','metas','biblioteca'].forEach(n=>{
    unsubs.push(onSnapshot(ref(n),snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!first[n]){
        if(snap.metadata.fromCache && !snap.exists()) return;
        first[n]=true; done++;
        let cloud=snap.exists()?(snap.data().items||[]):[];
        if(!merged){ const ids=new Set(cloud.map(x=>x.id)); const extra=cur(n).filter(x=>!ids.has(x.id)); if(extra.length){ cloud=cloud.concat(extra); push(n,{items:clone(cloud)}); } }
        if(done===5) try{localStorage.setItem('vico_merged_'+uid,'1');}catch(e){}
        setCur(n,cloud); render(); return;
      }
      setCur(n,snap.exists()?(snap.data().items||[]):[]); render();
    },()=>{}));
  });
  unsubs.push(onSnapshot(ref('config'),snap=>{
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists()){ config=snap.data(); try{localStorage.setItem('vico_config',JSON.stringify(config));}catch(e){} }
    else if(config.paraQue) push('config',{paraQue:config.paraQue});
    render();
  },()=>{}));
}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f()); unsubs=[]; first={}; done=0;
  if(u){ uid=u.uid; lr.style.display='none'; addOut(); listen(); }
  else { uid=null; showLogin(); }
});
</script>
</body>
</html>
