<style>
  :root{
    --bg:#FAEBE8; --card:#fffdfc; --ink:#362859; --sub:#8a7d95;
    --brand:#362859; --brand2:#8968AA; --accent:#EFE1EE; --line:#f0dcdd;
    --ok:#5c9c7c; --warn:#c98a4a; --err:#c94a4a;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }

  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  h1,h3,.cta,.persona .info .n{ font-family:"Fraunces","DM Sans",serif; }
  #app{display:flex; flex-direction:column; height:100%; max-width:480px; margin:0 auto; position:relative;}
  header.top{
    padding:18px 18px 10px; display:flex; align-items:center; justify-content:space-between;
  }
  header.top h1{margin:0 0 2px;}
  header.top span{font-size:11px; color:var(--sub); letter-spacing:1px; display:block;}
  header.top .tagline{font-size:9px; color:var(--brand2); letter-spacing:1.5px; margin-top:1px;}
  .vico-mark{width:110px; height:auto; fill:var(--brand); display:block;}
  .vico-mark-lg{width:150px; height:auto; fill:var(--brand); display:block; margin:0 auto 6px;}
  main{flex:1; overflow-y:auto; padding:0 16px 90px;}
  .card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px; border:1px solid var(--line);}
  .paraque{background:var(--accent); border-radius:16px; padding:14px 16px; margin-bottom:14px; font-size:14px; color:var(--brand); line-height:1.4;}
  .row{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:none;}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--brand2); flex:none;}
  .row .t{font-size:14px; flex:1;}
  .row .sub{font-size:12px; color:var(--sub);}
  .section-title{font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:var(--sub); margin:4px 0 8px;}
  .stat3{display:flex; gap:10px; margin-bottom:14px;}
  .stat3 .box{flex:1; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; text-align:center;}
  .stat3 .box b{display:block; font-size:20px; color:var(--brand);}
  .stat3 .box small{font-size:11px; color:var(--sub);}
  .cta{display:block; width:100%; padding:14px; border:none; border-radius:14px; background:var(--brand); color:#fff; font-size:15px; font-weight:600; margin-top:4px; cursor:pointer;}
  input,select,textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:14px; margin-bottom:10px;
  }
  .searchbar{position:sticky; top:0; background:var(--bg); padding:10px 0; z-index:10;}
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; margin-bottom:6px;}
  .chip{flex:none; padding:6px 14px; border-radius:20px; background:var(--card); border:1px solid var(--line); font-size:13px; color:var(--sub); cursor:pointer;}
  .chip.active{background:var(--brand); color:#fff; border-color:var(--brand);}
  .persona{display:flex; gap:12px; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .persona .av{width:38px; height:38px; border-radius:50%; background:var(--brand2); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; flex:none;}
  .persona .info{flex:1; min-width:0;}
  .persona .info .n{font-size:14px; font-weight:600;}
  .persona .info .m{font-size:12px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tag{font-size:10px; padding:2px 8px; border-radius:10px; background:var(--accent); color:var(--brand); display:inline-block; margin-top:2px;}
  .tag-ok{background:#e2f2e9; color:var(--ok);}
  .tag-no{background:#fce8e8; color:var(--err);}
  .fab{position:fixed; right:calc((100vw - 480px)/2 + 20px); bottom:calc(90px + env(safe-area-inset-bottom,0px)); width:52px; height:52px; border-radius:50%; background:var(--brand); color:#fff; border:none; font-size:26px; line-height:1; padding:0; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(54,40,89,.3); cursor:pointer;}
  @media (max-width:520px){.fab{right:20px;}}
  nav.bottom{
    position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--line);
    display:flex; padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px)); z-index:20;
  }
  nav.bottom button{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center;
    gap:2px; color:var(--sub); font-size:10px; padding:4px; cursor:pointer;
  }
  nav.bottom button.active{color:var(--brand); font-weight:600;}
  nav.bottom .ic{font-size:18px;}
  .empty{text-align:center; color:var(--sub); font-size:13px; padding:24px 0;}
  .backdrop{position:fixed; inset:0; background:rgba(0,0,0,.4); display:flex; align-items:flex-end; z-index:50;}
  .sheet{position:relative; background:var(--card); width:100%; max-width:480px; margin:0 auto; border-radius:20px 20px 0 0; padding:18px; max-height:85vh; overflow-y:auto; padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));}
  .sheet h3{margin:0 0 12px; color:var(--brand);}
  .sheet .actions{display:flex; gap:10px; margin-top:6px;}
  .sheet .actions button{flex:1; padding:12px; border-radius:10px; border:none; font-size:14px; cursor:pointer;}
  .btn-primary{background:var(--brand); color:#fff;}
  .btn-secondary{background:var(--accent); color:var(--brand);}
  .detail-hist{font-size:13px; padding:8px 0; border-bottom:1px solid var(--line);}
  .detail-hist .d{color:var(--sub); font-size:11px;}
  .close-x{position:absolute; top:10px; right:10px; background:var(--accent); border:none; font-size:18px; color:var(--brand); width:30px; height:30px; border-radius:50%; z-index:5; cursor:pointer;}

  /* Tarjetas de Prospectos */
  .prospecto-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;
  }
  .prospecto-card.contactado{ border-left:5px solid var(--ok); opacity:0.85; }
  .prospecto-card.descartado{ border-left:5px solid var(--err); opacity:0.5; }
  .prospecto-header{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px; }
  .prospecto-title{ font-weight:700; font-size:15px; color:var(--brand); }
  .prospecto-sub{ font-size:12px; color:var(--sub); }
  .prospecto-body{ font-size:13px; margin:8px 0; line-height:1.4; color:var(--ink); }
  .prospecto-actions{ display:flex; gap:8px; margin-top:10px; }
  .btn-check{ flex:1; padding:8px; border-radius:8px; border:1px solid var(--ok); background:#e2f2e9; color:var(--ok); font-weight:600; cursor:pointer; font-size:12px; text-align:center; }
  .btn-cross{ flex:1; padding:8px; border-radius:8px; border:1px solid var(--err); background:#fce8e8; color:var(--err); font-weight:600; cursor:pointer; font-size:12px; text-align:center; }
  .btn-reset{ padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--sub); font-size:12px; cursor:pointer; }

  @media (min-width:860px){
    #app{
      display:grid; grid-template-columns:220px 1fr; grid-template-areas:"nav header" "nav main";
      max-width:1100px; min-height:100vh; align-items:start;
    }
    header.top{ grid-area:header; padding:24px 32px 14px; }
    main{ grid-area:main; max-width:760px; padding:0 32px 60px; }
    nav.bottom{
      grid-area:nav; flex-direction:column; align-items:stretch; gap:4px;
      position:sticky; top:0; height:100vh; padding:20px 12px; border-top:none; border-right:1px solid var(--line);
    }
    nav.bottom button{ flex:none; width:100%; flex-direction:row; justify-content:flex-start; gap:10px; padding:10px 14px; border-radius:10px; font-size:13px; }
    nav.bottom button.active{ background:var(--accent); }
    .fab{ right:calc((100vw - 1100px)/2 + 40px); bottom:40px; }
    @media (max-width:1140px){ .fab{ right:40px; } }
    main{ padding:0 40px 60px; max-width:1000px; }
    .cta{ width:auto; min-width:220px; display:inline-block; }
    .list-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; }
  }
</style>
</head>

async function boot(){
  loadLocal();
  document.querySelectorAll('nav.bottom button').forEach(b=>{
    b.addEventListener('click', ()=>{ tab=b.dataset.tab; render(); });
  });
  const fab = document.getElementById('fab');
  if(fab) fab.addEventListener('click', ()=> openPersonaForm());
  render();
}

function render(){
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===(tab==='clientes'?'mas':tab)));
  const fab = document.getElementById('fab');
  if(fab) fab.style.display = tab==='personas' ? 'flex' : 'none';
  if(tab==='inicio') renderInicio();
  else if(tab==='prospectos') renderProspectos();
  else if(tab==='personas') renderPersonas();
  else if(tab==='agenda') renderAgenda();
  else if(tab==='clientes') renderClientes();
  else if(tab==='metas') renderMetas();
  else if(tab==='equipo') renderEquipo();
  else if(tab==='biblioteca') renderBiblioteca();
  else if(tab==='estadisticas') renderEstadisticas();
  else if(tab==='campanas') renderCampanas();
  else if(tab==='qr') renderQR();
  else if(tab==='mensajes') renderMensajes();
  else if(tab==='historial') renderHistorial();
  else if(tab==='progreso') renderProgreso();
  else renderMas();
}

function renderProspectos(){
  const contactados = prospectos.filter(p=>p.estado==='Contactado').length;
  const descartados = prospectos.filter(p=>p.estado==='Descartado').length;
  const pendientes = prospectos.filter(p=>p.estado==='Pendiente').length;

  const list = prospectos.filter(p => {
    if(prospectoFiltro==='Pendientes') return p.estado==='Pendiente';
    if(prospectoFiltro==='Contactados') return p.estado==='Contactado';
    if(prospectoFiltro==='Descartados') return p.estado==='Descartado';
    return true;
  });

  $main.innerHTML = `
    <div class="section-title">Lote de Prospectos #${loteActual}</div>
    <div class="stat3">
      <div class="box"><b>${pendientes}</b><small>Pendientes</small></div>
      <div class="box"><b>${contactados}</b><small>Contactados</small></div>
      <div class="box"><b>${descartados}</b><small>Descartados</small></div>
    </div>

    <div class="chips">
      ${['Todos','Pendientes','Contactados','Descartados'].map(f=>`<div class="chip ${prospectoFiltro===f?'active':''}" data-pf="${f}">${f}</div>`).join('')}
    </div>

    <div>
      ${list.length ? list.map(p => `
        <div class="prospecto-card ${p.estado.toLowerCase()}">
          <div class="prospecto-header">
            <div>
              <div class="prospecto-title">${p.nombre}</div>
              <div class="prospecto-sub">${p.instagram} · ${p.ciudad},${p.pais}</div>
            </div>
            <span class="tag ${p.estado==='Contactado'?'tag-ok':p.estado==='Descartado'?'tag-no':''}">${p.estado}</span>
          </div>
          <div class="prospecto-body">
            <b>Profesión:</b> ${p.profesion}<br>
            <b>Afinidad:</b> ${p.afinidad} · <b>Aprox:</b>${p.seguidores} seg.<br>
            <div style="margin-top:4px;"><b>Sugerencia de charla:</b> ${p.tema}</div>
          </div>
          <div class="prospecto-actions">
            <button class="btn-check" data-chk="${p.id}">✓ Contactado</button>
            <button class="btn-cross" data-crs="${p.id}">✕ Descartar</button>
            ${p.estado!=='Pendiente'?`<button class="btn-reset" data-rst="${p.id}">↩</button>`:''}
          </div>
        </div>
      `).join('') : '<div class="empty">No hay prospectos en este filtro.</div>'}
    </div>

    <div style="margin-top:20px; text-align:center;">
      <button class="cta" id="btnNuevoLote" style="background:var(--brand); display:block; width:100%;">⚡ GENERAR / CARGAR SIGUIENTE LOTE (+30)</button>
    </div>
  `;

  $main.querySelectorAll('[data-pf]').forEach(el=>el.addEventListener('click',()=>{ prospectoFiltro=el.dataset.pf; renderProspectos(); }));$main.querySelectorAll('[data-chk]').forEach(el=>el.addEventListener('click',()=>{
    const item = prospectos.find(x=>x.id===el.dataset.chk);
    if(item){
      item.estado = 'Contactado';
      saveProspectos();
      if(!personas.find(x=>x.nombre===item.nombre)){
        personas.push({
          id: uid(), nombre: item.nombre, instagram: item.instagram, pais: item.pais,
          telefono: "", tipo: "Potencial", ultimaNota: item.tema, historial: [{fecha: todayStr(), texto: "Primer contacto realizado desde Lote Prospectos"}],
          proximaAccion: "Seguimiento inicial", proximaFecha: todayStr()
        });
        savePersonas();
      }
      renderProspectos();
    }
  }));

  $main.querySelectorAll('[data-crs]').forEach(el=>el.addEventListener('click',()=>{
    const item = prospectos.find(x=>x.id===el.dataset.crs);
    if(item){ item.estado = 'Descartado'; saveProspectos(); renderProspectos(); }

  $main.querySelectorAll('[data-rst]').forEach(el=>el.addEventListener('click',()=>{

function openPersonaForm(){

function openPersonaDetail(id){

    <p>${p.ultimaNota||''}</p>
    <div class="actions"><button class="btn-primary" onclick="closeModal()">Cerrar</button></div>
  `);
}

boot();

  await addDoc(collection(fs,'mensajes'),{de:uid,deNombre:window.miNombre||'',destinatarios,texto:texto||'',campanaId:campanaId||'',campanaNombre:campanaNombre||'',fecha:new Date().toISOString()});
};
let uid=null, unsubs=[], first={}, done=0;
const ref=n=>doc(fs,'usuarios',uid,'datos',n);
const lr=document.getElementById('loginRoot');
const clone=x=>JSON.parse(JSON.stringify(x));
const push=(n,data)=>{ if(uid) setDoc(ref(n),data).catch(()=>{}); };
const cur=n=>n==='personas'?personas:n==='eventos'?eventos:n==='metas'?metas:n==='biblioteca'?biblioteca:n==='campanas'?campanas:n==='rutinas'?rutinas:bloques;
const setCur=(n,a)=>{ if(n==='personas'){personas=a;} else if(n==='eventos'){eventos=a;} else if(n==='metas'){metas=a;} else if(n==='biblioteca'){biblioteca=a;} else if(n==='campanas'){campanas=a;} else if(n==='rutinas'){rutinas=a;} else {bloques=a;} try{localStorage.setItem('vico_'+n,JSON.stringify(a));}catch(e){} };
window.savePersonas=()=>{ try{localStorage.setItem('vico_personas',JSON.stringify(personas));}catch(e){} push('personas',{items:clone(personas)}); };
window.saveEventos=()=>{ try{localStorage.setItem('vico_eventos',JSON.stringify(eventos));}catch(e){} push('eventos',{items:clone(eventos)}); };
window.saveMetas=()=>{ try{localStorage.setItem('vico_metas',JSON.stringify(metas));}catch(e){} push('metas',{items:clone(metas)}); };
window.saveBiblioteca=()=>{ try{localStorage.setItem('vico_biblioteca',JSON.stringify(biblioteca));}catch(e){} push('biblioteca',{items:clone(biblioteca)}); };
window.saveCampanas=()=>{ try{localStorage.setItem('vico_campanas',JSON.stringify(campanas));}catch(e){} push('campanas',{items:clone(campanas)}); };
window.saveRutinas=()=>{ try{localStorage.setItem('vico_rutinas',JSON.stringify(rutinas));}catch(e){} push('rutinas',{items:clone(rutinas)}); };
window.saveBloques=()=>{ try{localStorage.setItem('vico_bloques',JSON.stringify(bloques));}catch(e){} push('bloques',{items:clone(bloques)}); };
window.saveConfig=()=>{ try{localStorage.setItem('vico_config',JSON.stringify(config));}catch(e){} push('config',{paraQue:config.paraQue||'', vision:config.vision||''}); };

function showLogin(msg){
  if(!lr) return;
  lr.style.display='flex';
  lr.innerHTML=`<div style="width:100%;max-width:340px;text-align:center;"><svg class="vico-mark-lg" viewBox="0 0 1080 569.95" xmlns="http://www.w3.org/2000/svg"><path d="M181.09,250.79c.24,40.41,9.58,82.79,31.62,117.21,19.04,29.74,55.91,36.68,74.05,2.07,15.54-29.64,16.32-62.52,26.63-93.71,15.11-45.72,48.17-69.51,96.5-65.8,22.76,1.74,22.65-33.73,0-35.46-67.23-5.15-114.66,35.15-132.71,98.42-3.99,13.99-5.92,28.42-9.01,42.61-1.75,8.02-6.42,36.21-13.41,38.85-15.73,5.94-27.46-38.08-30.07-46.74-5.67-18.8-8.03-37.84-8.15-57.44-.13-22.81-35.6-22.86-35.46,0h0Z"/><path d="M866.61,374.25c-28.42,20.88-74.34,28.06-106.84,13.17-17.07-7.8-29.61-22.56-36.66-39.72-15.96,17.25-35.6,30.85-58.16,39.06-34.53,12.5-83.03,11.62-111.67-14.45-12.28-11.17-20.7-26.55-24.83-43.13-16,23.67-34.44,47.79-60.16,59.54-30.99,14.19-61.09-.93-72.84-31.56-12.41-32.32-7.54-68.71-3.28-102.14,2.84-22.39,38.3-22.56,35.46,0-3.46,27.09-13.21,70.8,3.5,95.58,21.99,32.5,66.72-39.5,76.96-54.7,9.75-14.5,22.65-32.36,37.73-46.95,7.85-7.62,16.31-14.36,25.22-19.28.09-.04.13-.09.22-.09,18.97-10.46,40.03-12.59,61.89,2.53,18.53,12.86,1.86,42.65-17.87,30.63-30.68-18.62-56.12,19.2-54.13,46.73,1.82,25.76,16.58,41.94,41.05,47.57,53.29,12.28,99.57-27,120.36-72.57,9.53-20.88,39.59-2.7,30.63,17.91-10.2,23.45,10.86,52.98,34.14,56.26,18.97,2.66,41.85-.93,57.72-12.32,20.48-14.76,23.19-41.23,12.37-63.22-14.45-29.52-46.95-31.25-75.1-22.56-21.9,6.78-31.16-27.44-9.44-34.18,46.24-14.32,97.13-2.53,117.88,44.73,16,36.57,8.64,79.04-24.16,103.2Z"/><path d="M571.05,229.64c-8.91,4.92-17.38,11.66-25.22,19.28,7.09-8.16,15.74-14.76,25.22-19.28Z"/></svg><div style="font-size:11px;color:var(--sub);letter-spacing:1px;margin-bottom:22px;">MI OFICINA · CONCIENCIA EN ACCIÓN</div><input id="lg_mail" type="email" placeholder="Correo" autocomplete="username"><input id="lg_pass" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="cta" id="lg_go">Entrar</button><a href="mailto:ezequiel135@hotmail.com?subject=Solicito%20acceso%20a%20VICO%20%C2%B7%20Mi%20Oficina&body=Hola!%20Me%20gustar%C3%ADa%20solicitar%20acceso%20a%20la%20app%20VICO%20%C2%B7%20Mi%20Oficina.%20Mi%20correo%20es%3A%20" class="cta" style="display:block;box-sizing:border-box;text-decoration:none;background:var(--accent);color:var(--brand);margin-top:10px;">Solicitar acceso</a><div id="lg_msg" style="color:#b3423a;font-size:13px;margin-top:10px;min-height:18px;">${msg||''}</div></div>`;
  const go=()=>{ const m=document.getElementById('lg_mail').value.trim(), p=document.getElementById('lg_pass').value; if(!m||!p) return;
    signInWithEmailAndPassword(auth,m,p).catch(()=>{ document.getElementById('lg_msg').textContent='Correo o contraseña incorrectos.'; }); };
  document.getElementById('lg_go').addEventListener('click',go);
  document.getElementById('lg_pass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
}
function addOut(){
  if(document.getElementById('outBtn')) return;
  const b=document.createElement('button'); b.id='outBtn'; b.textContent='Salir';
  b.style.cssText='background:none;border:none;color:var(--sub);font-size:12px;';
  b.addEventListener('click',async()=>{ if(!confirm('¿Cerrar sesión en este dispositivo?')) return; await signOut(auth); ['personas','eventos','bloques','config'].forEach(k=>{try{localStorage.removeItem('vico_'+k);}catch(e){}}); location.reload(); });
  const topHeader = document.querySelector('header.top');
  if(topHeader) topHeader.appendChild(b);
}
function listen(){
  const dirKey='vico_dirname_set_'+uid;
  if(!localStorage.getItem(dirKey)){
    let nombre=prompt('¿Cómo querés que te vean los demás en los mensajes?', (auth.currentUser&&auth.currentUser.email||'').split('@')[0]);
    nombre=(nombre||'Usuario').trim()||'Usuario';
    window.miNombre=nombre;
    setDoc(doc(fs,'directorio',uid),{nombre,email:(auth.currentUser&&auth.currentUser.email||'')}).catch(()=>{});
    try{localStorage.setItem(dirKey,nombre);}catch(e){}
  } else {
    window.miNombre=localStorage.getItem(dirKey);
  }
  window.miUid=uid;
  unsubs.push(onSnapshot(collection(fs,'directorio'),snap=>{
    window.directorio=snap.docs.map(d=>({uid:d.id,...d.data()}));
    if(tab==='mensajes'||tab==='nuevomsg') render();
  },()=>{}));
  unsubs.push(onSnapshot(query(collection(fs,'mensajes'),orderBy('fecha','desc'),limit(200)),snap=>{
    window.mensajes=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(tab==='mensajes') render();
  },()=>{}));
  const merged=localStorage.getItem('vico_merged_'+uid);
  ['personas','eventos','bloques','metas','biblioteca','campanas','rutinas'].forEach(n=>{
    unsubs.push(onSnapshot(ref(n),snap=>{
      if(snap.metadata.hasPendingWrites) return;
      if(!first[n]){
        if(snap.metadata.fromCache && !snap.exists()) return;
        first[n]=true; done++;
        let cloud=snap.exists()?(snap.data().items||[]):[];
        if(!merged){ const ids=new Set(cloud.map(x=>x.id)); const extra=cur(n).filter(x=>!ids.has(x.id)); if(extra.length){ cloud=cloud.concat(extra); push(n,{items:clone(cloud)}); } }
        if(done===7) try{localStorage.setItem('vico_merged_'+uid,'1');}catch(e){}
        setCur(n,cloud); render(); return;
      }
      setCur(n,snap.exists()?(snap.data().items||[]):[]); render();
    },()=>{}));
  });
  unsubs.push(onSnapshot(ref('config'),snap=>{
    if(snap.metadata.hasPendingWrites) return;
    if(snap.exists()){ config=snap.data(); try{localStorage.setItem('vico_config',JSON.stringify(config));}catch(e){} }
    else if(config.paraQue||config.vision) push('config',{paraQue:config.paraQue||'', vision:config.vision||''});
    render();
  },()=>{}));
}
onAuthStateChanged(auth,u=>{
  unsubs.forEach(f=>f()); unsubs=[]; first={}; done=0;
  if(u){ uid=u.uid; if(lr) lr.style.display='none'; addOut(); listen(); }
  else { uid=null; showLogin(); }
});
</script>
